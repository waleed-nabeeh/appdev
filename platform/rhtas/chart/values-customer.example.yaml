name: securesign

domain: apps.CUSTOMER_CLUSTER_DOMAIN

organization:
  name: CUSTOMER_ORGANIZATION
  email: PLATFORM_TEAM_EMAIL

oidc:
  issuer: https://kubernetes.default.svc
  issuerURL: https://kubernetes.default.svc
  clientID: trusted-artifact-signer
  type: kubernetes

storage:
  className: APPROVED_RWO_STORAGE_CLASS
  tufSize: 5Gi
  rekorSize: 20Gi

tsa:
  enabled: false
  privateKeySecret:
    name: tsa-signer-key
    key: tsa.key.pem
  passwordSecret:
    name: tsa-password
    key: password
  certificateChainSecret:
    name: tsa-cert-chain
    key: tsa.certchain.pem
