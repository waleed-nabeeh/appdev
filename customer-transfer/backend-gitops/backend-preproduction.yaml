# Helm values for RedHat_argocd. Auto-sync is disabled for the initial Git-only test.
# Initial tags are reference tags, not verified hub Quay artifacts.
# Preprod Route hosts do not configure the Argo CD destination cluster.
argocd-applications:
  applications:

    # pre-acl-service
    pre-acl-service:
      name: pre-acl-service
      project: preproduction-core-apps
      destination:
        namespace: pre-backend
      source:
        sourceType: helm
        chart: app-chart
        targetRevision: 1.0.0
      syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      autoSync: false
      overrideValues:
        nameOverride: acl-service
        fullnameOverride: acl-service
        global:
          nameOverride: acl-service
          fullnameOverride: acl-service
          serviceAccountName: default
        workload:
          kind: Deployment
          replicas: 1
        image:
          repository: quay-registry-prod.apps.hub-visa-ocp.mofa.gov.sa/devops/acl-service
          tag: "7af5d95a"
          pullPolicy: IfNotPresent
          pullSecrets:
          - name: pullsecret
        containerPorts:
        - name: http
          containerPort: 8080
          protocol: TCP
        envFrom:
          secrets:
          - name: acl-service-pre-external
        extraVolumes:
        - name: appsettings-pre
          secret:
            secretName: acl-service-appsettings
            defaultMode: 256
        extraVolumeMounts:
        - name: appsettings-pre
          mountPath: "/app/appsettings.pre.json"
          subPath: appsettings.pre.json
          readOnly: true
        podSecurityContext: {}
        securityContext: {}
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        probes:
          liveness:
            enabled: true
            type: httpGet
            httpGet:
              path: "/healthz"
              port: http
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
            successThreshold: 1
          readiness:
            enabled: true
            type: httpGet
            httpGet:
              path: "/healthz"
              port: http
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          startup:
            enabled: true
            type: httpGet
            httpGet:
              path: "/healthz"
              port: http
              scheme: HTTP
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
            successThreshold: 1
        service:
          enabled: true
          type: ClusterIP
          ports:
          - name: http
            port: 8080
            targetPort: http
            protocol: TCP
        route:
          enabled: true
          host: acl-service-dev.apps.int.pre-visa-ocp.mofa.gov.sa
          path: "/"
          port:
            targetPort: http
          tls:
            enabled: true

