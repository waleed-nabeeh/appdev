# Add after values-devops.yaml and any existing frontend-release overlay.
backendBuild:
  enabled: true
  sourceRevision: test
  # Match the 14 folders shown under /services on the customer's test branch.
  # Payment is absent; Gateway and AuthServer are outside this requested scope.
  selectedServices:
    - acl-service
    - administration-service
    - audit-logging-service
    - core-service
    - identity-service
    - language-service
    - document-service
    - event-service
    - notification-service
    - request-service
    - stakeholder-service
    - applicant-service
    - visitvisa-service
    - realtime-service
  workspaceSize: 3Gi
  # Preserve ACL's blocking test behavior. Do not silently ignore backend failures.
  allowTestFailure: false
  buildArgs:
    - CERT_KEYWORD=dev
