# Add after values-devops.yaml and any existing frontend-release overlay.
backendBuild:
  enabled: true
  sourceRevision: test
  selectedServices: [] # All 17; for a smaller test use [acl-service, payment-service].
  workspaceSize: 3Gi
  # Preserve ACL's blocking test behavior. Do not silently ignore backend failures.
  allowTestFailure: false
  buildArgs:
    - CERT_KEYWORD=dev
