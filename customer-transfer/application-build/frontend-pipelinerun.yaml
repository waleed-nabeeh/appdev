# Manual start: only services is supplied; the entry Pipeline provides all other defaults.
---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: frontend-build-start-
  namespace: devops
  labels:
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: application-build
spec:
  pipelineRef:
    name: application-frontend-build
  taskRunTemplate:
    serviceAccountName: pipeline
  timeouts:
    pipeline: 20m0s
    tasks: 19m0s
  params:
  - name: services
    value: admin-portal,applicant-portal,operational-portal
