# Manual defaults list every enabled service explicitly. Remove names for a smaller run.
---
apiVersion: tekton.dev/v1
kind: TaskRun
metadata:
  generateName: backend-dispatch-
  namespace: devops
  labels:
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: application-build
spec:
  taskRef:
    name: backend-build-dispatch
  serviceAccountName: backend-dispatcher
  timeout: 20m0s
  params:
  - name: services
    value: "acl-service,administration-service,audit-logging-service,core-service,identity-service,language-service,document-service,event-service,notification-service,request-service,stakeholder-service,applicant-service,visitvisa-service,realtime-service"
  - name: source-url
    value: https://azuredevops.mofa.gov.sa/MOFA/UnifiedVisaPlatform/_git/RedHat_UnifiedVisaPlatform.Backend
  - name: env
    value: dev
  - name: selection-mode
    value: manual
  - name: source-revision
    value: test
  - name: source-commit
    value: ''
  workspaces:
  - name: git-credentials
    secret:
      secretName: git-credentials
---
apiVersion: tekton.dev/v1
kind: TaskRun
metadata:
  generateName: frontend-dispatch-
  namespace: devops
  labels:
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: application-build
spec:
  taskRef:
    name: frontend-build-dispatch
  serviceAccountName: frontend-dispatcher
  timeout: 20m0s
  params:
  - name: services
    value: "admin-portal,applicant-portal,operational-portal"
  - name: source-url
    value: https://azuredevops.mofa.gov.sa/MOFA/UnifiedVisaPlatform/_git/RedHat_UnifiedVisaPlatform.Frontend
  - name: env
    value: dev
  - name: selection-mode
    value: manual
  - name: source-revision
    value: pre-prod
  - name: source-commit
    value: ''
  workspaces:
  - name: git-credentials
    secret:
      secretName: git-credentials
