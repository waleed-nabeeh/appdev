# Launches one build PipelineRun per scope, with only selected lanes. Replace services: all with comma-separated allowed names.
---
apiVersion: tekton.dev/v1
kind: TaskRun
metadata:
  generateName: backend-dispatch-
  namespace: devops
  labels:
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: application-build
spec:
  taskRef:
    name: backend-build-dispatch
  serviceAccountName: backend-dispatcher
  timeout: 20m0s
  params:
  - name: services
    value: all
  - name: selection-mode
    value: manual
  - name: source-revision
    value: test
  - name: source-commit
    value: ''
  workspaces:
  - name: git-credentials
    secret:
      secretName: git-credentials
---
apiVersion: tekton.dev/v1
kind: TaskRun
metadata:
  generateName: frontend-dispatch-
  namespace: devops
  labels:
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: application-build
spec:
  taskRef:
    name: frontend-build-dispatch
  serviceAccountName: frontend-dispatcher
  timeout: 20m0s
  params:
  - name: services
    value: all
  - name: selection-mode
    value: manual
  - name: source-revision
    value: pre-prod
  - name: source-commit
    value: ''
  workspaces:
  - name: git-credentials
    secret:
      secretName: git-credentials
