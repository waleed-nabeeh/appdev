# Manual start: only services is supplied; the entry Pipeline provides all other defaults.
---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: backend-build-start-
  namespace: devops
  labels:
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: application-build
spec:
  pipelineRef:
    name: application-backend-build
  taskRunTemplate:
    serviceAccountName: pipeline
  timeouts:
    pipeline: 20m0s
    tasks: 19m0s
  params:
  - name: services
    value: acl-service,administration-service,audit-logging-service,core-service,identity-service,language-service,document-service,event-service,notification-service,request-service,stakeholder-service,applicant-service,visitvisa-service,realtime-service
