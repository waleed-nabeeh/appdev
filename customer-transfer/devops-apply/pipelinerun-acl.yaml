apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: acl-service-full-
  namespace: devops
  labels:
    app.kubernetes.io/part-of: customer-application-validation
    app.kubernetes.io/component: backend
    app.kubernetes.io/name: acl-service
spec:
  pipelineRef:
    name: application-release
  serviceAccountName: pipeline
  params:
    - name: source-url
      value: https://azuredevops.mofa.gov.sa/MOFA/UnifiedVisaPlatform/_git/RedHat_UnifiedVisaPlatform.Backend
    - name: source-revision
      value: test
    - name: dotnet-project
      value: services/acl/MOFA.UnifiedVisaPlatform.ACL/MOFA.UnifiedVisaPlatform.ACL.csproj
    - name: http-proxy
      value: http://172.24.223.254:8080
    - name: https-proxy
      value: http://172.24.223.254:8080
    - name: no-proxy
      value: .mofa.gov.sa
    - name: build-args
      value:
        - HTTP_PROXY=http://172.24.223.254:8080
        - HTTPS_PROXY=http://172.24.223.254:8080
        - NO_PROXY=.mofa.gov.sa
        - CERT_KEYWORD=dev
    - name: image
      value: quay-registry-prod.apps.hub-visa-ocp.mofa.gov.sa/devops/acl-service:validation
    - name: build-context
      value: .
    - name: containerfile
      value: services/acl/MOFA.UnifiedVisaPlatform.ACL/Dockerfile
    - name: gitops-url
      value: https://azuredevops.mofa.gov.sa/MOFA/UnifiedVisaPlatform/_git/RedHat_HelmCharts
    - name: gitops-revision
      value: test-repo
    - name: values-file
      value: development/apps/core-apps.yaml
    - name: perform-gitops-update
      value: "false"
  workspaces:
    - name: source
      persistentVolumeClaim:
        claimName: pipeline
    - name: git-credentials
      secret:
        secretName: git-credentials
    - name: registry-auth
      secret:
        secretName: registry-auth
