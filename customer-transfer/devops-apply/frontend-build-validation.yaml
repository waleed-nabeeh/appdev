apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: application-frontend-build-validation
  namespace: devops
spec:
  params:
    - name: source-url
      type: string
    - name: source-revision
      type: string
      default: test
    - name: image
      type: string
    - name: containerfile
      type: string
      default: deployment/admin-portal/Dockerfile
    - name: build-args
      type: array
      default: []
  workspaces:
    - name: source
    - name: git-credentials
      optional: true
    - name: registry-auth
    - name: npm-auth
  tasks:
    - name: clone
      taskRef:
        name: clone
      params:
        - name: url
          value: $(params.source-url)
        - name: revision
          value: $(params.source-revision)
      workspaces:
        - name: source
          workspace: source
        - name: git-credentials
          workspace: git-credentials
    - name: unit-test
      runAfter: [clone]
      onError: continue
      taskRef:
        name: frontend-unit-test
      params:
        - name: project
          value: admin-portal
      workspaces:
        - name: source
          workspace: source
        - name: npm-auth
          workspace: npm-auth
    - name: build-image
      runAfter: [unit-test]
      taskRef:
        name: build-image
      params:
        - name: image
          value: $(params.image)
        - name: context
          value: .
        - name: containerfile
          value: $(params.containerfile)
        - name: build-args
          value: ["$(params.build-args[*])"]
      workspaces:
        - name: source
          workspace: source
        - name: registry-auth
          workspace: registry-auth
        - name: npm-auth
          workspace: npm-auth
    - name: sign-image
      runAfter: [build-image]
      taskRef:
        name: sign-image
      params:
        - name: image
          value: $(tasks.build-image.results.image-url)
      workspaces:
        - name: registry-auth
          workspace: registry-auth
    - name: verify-image
      runAfter: [sign-image]
      taskRef:
        name: verify-image
      params:
        - name: image
          value: $(tasks.build-image.results.image-url)
      workspaces:
        - name: registry-auth
          workspace: registry-auth
---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: frontend-admin-portal-validation-
  namespace: devops
  labels:
    app.kubernetes.io/part-of: customer-application-validation
    app.kubernetes.io/component: frontend
    app.kubernetes.io/name: admin-portal
spec:
  pipelineRef:
    name: application-frontend-build-validation
  serviceAccountName: pipeline
  params:
    - name: source-url
      value: https://azuredevops.mofa.gov.sa/MOFA/UnifiedVisaPlatform/_git/RedHat_UnifiedVisaPlatform.Frontend
    - name: source-revision
      value: test
    - name: image
      value: quay-registry-prod.apps.hub-visa-ocp.mofa.gov.sa/devops/admin-portal:frontend-validation
    - name: containerfile
      value: deployment/admin-portal/Dockerfile
    - name: build-args
      value:
        - BUILD_ENVIRONMENT=dev
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 3Gi
    - name: git-credentials
      secret:
        secretName: git-credentials
    - name: registry-auth
      secret:
        secretName: registry-auth
    - name: npm-auth
      secret:
        secretName: npm-auth
