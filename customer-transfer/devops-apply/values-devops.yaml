# Target-environment Helm values for the centralized pipeline chart.
images:
  git: quay-registry-prod.apps.hub-visa-ocp.mofa.gov.sa/devops/alpine-git:2026-10-07
  dotnet: quay-registry-prod.apps.hub-visa-ocp.mofa.gov.sa/devops/dotnet-100:10.0
  nodejs24: quay-registry-prod.apps.hub-visa-ocp.mofa.gov.sa/devops/nodejs-24:ubi9
  buildah: quay-registry-prod.apps.hub-visa-ocp.mofa.gov.sa/devops/buildah:ocp4.22
  skopeo: quay-registry-prod.apps.hub-visa-ocp.mofa.gov.sa/devops/skopeo:ocp4.22
  rhacs: quay-registry-prod.apps.hub-visa-ocp.mofa.gov.sa/devops/rhacs-roxctl:4.11.4
  rhtasClientServer: quay-registry-prod.apps.hub-visa-ocp.mofa.gov.sa/devops/rhtas-client-server:1.4.3

rhtas:
  audience: trusted-artifact-signer
  clientUrl: http://cli-server.trusted-artifact-signer.svc:8080
  certificateIdentityRegexp: ^https://kubernetes.io/namespaces/devops/serviceaccounts/pipeline$
  certificateOidcIssuer: https://kubernetes.default.svc
  fulcioUrl: https://fulcio-server-trusted-artifact-signer.apps.hub-visa-ocp.mofa.gov.sa
  rekorUrl: https://rekor-server-trusted-artifact-signer.apps.hub-visa-ocp.mofa.gov.sa
  tufUrl: https://tuf-trusted-artifact-signer.apps.hub-visa-ocp.mofa.gov.sa

proxy:
  secretName: pipeline-proxy

rhacs:
  insecureSkipTLSVerify: false

serviceAccount:
  name: pipeline

frontendPr:
  enabled: true
  targetBranch: pre-prod
  proxyImage: quay-registry-prod.apps.hub-visa-ocp.mofa.gov.sa/devops/nginx-unprivileged:1.28.1-alpine3.23
