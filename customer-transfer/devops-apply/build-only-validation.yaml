apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: application-build-only-validation
  namespace: devops
spec:
  params:
    - name: source-url
      type: string
    - name: source-revision
      type: string
    - name: dotnet-project
      type: string
    - name: image
      type: string
    - name: build-context
      type: string
      default: .
    - name: containerfile
      type: string
      default: Containerfile
    - name: build-args
      type: array
      default: []
  workspaces:
    - name: source
    - name: git-credentials
    - name: registry-auth
  tasks:
    - name: clone
      taskRef:
        name: clone
      params:
        - name: url
          value: $(params.source-url)
        - name: revision
          value: $(params.source-revision)
      workspaces:
        - name: source
          workspace: source
        - name: git-credentials
          workspace: git-credentials
    - name: unit-test
      runAfter: [clone]
      taskRef:
        name: unit-test
      params:
        - name: project
          value: $(params.dotnet-project)
      workspaces:
        - name: source
          workspace: source
    - name: build-image
      runAfter: [unit-test]
      taskRef:
        name: build-image
      params:
        - name: image
          value: $(params.image)
        - name: context
          value: $(params.build-context)
        - name: containerfile
          value: $(params.containerfile)
        - name: build-args
          value: ["$(params.build-args[*])"]
      workspaces:
        - name: source
          workspace: source
        - name: registry-auth
          workspace: registry-auth
    - name: sign-image
      runAfter: [build-image]
      taskRef:
        name: sign-image
      params:
        - name: image
          value: $(tasks.build-image.results.image-url)
      workspaces:
        - name: registry-auth
          workspace: registry-auth
    - name: verify-image
      runAfter: [sign-image]
      taskRef:
        name: verify-image
      params:
        - name: image
          value: $(tasks.build-image.results.image-url)
      workspaces:
        - name: registry-auth
          workspace: registry-auth
---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: acl-build-only-
  namespace: devops
  labels:
    app.kubernetes.io/part-of: customer-application-validation
    app.kubernetes.io/component: backend
    app.kubernetes.io/name: acl-service
spec:
  pipelineRef:
    name: application-build-only-validation
  serviceAccountName: pipeline
  params:
    - name: source-url
      value: https://azuredevops.mofa.gov.sa/MOFA/UnifiedVisaPlatform/_git/RedHat_UnifiedVisaPlatform.Backend
    - name: source-revision
      value: test
    - name: dotnet-project
      value: services/acl/MOFA.UnifiedVisaPlatform.ACL/MOFA.UnifiedVisaPlatform.ACL.csproj
    - name: image
      value: quay-registry-prod.apps.hub-visa-ocp.mofa.gov.sa/devops/acl-service:build-only
    - name: build-context
      value: .
    - name: containerfile
      value: services/acl/MOFA.UnifiedVisaPlatform.ACL/Dockerfile
    - name: build-args
      value:
        - CERT_KEYWORD=dev
  workspaces:
    - name: source
      persistentVolumeClaim:
        claimName: pipeline
    - name: git-credentials
      secret:
        secretName: git-credentials
    - name: registry-auth
      secret:
        secretName: registry-auth
