apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-vault-reader
  namespace: devops
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: devops
spec:
  provider:
    vault:
      server: https://vault.apps.hub-visa-ocp.mofa.gov.sa
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso-devops-test
          serviceAccountRef:
            name: eso-vault-reader
            namespace: devops
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: eso-vault-test
  namespace: devops
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: eso-vault-test
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
  data:
    - secretKey: message
      remoteRef:
        key: secret/data/devops/eso-test
        property: message
