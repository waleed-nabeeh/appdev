replicaCount: 1

image:
  repository: INTERNAL_QUAY/ORGANIZATION/dotnet-sample
  tag: approved
  digest: sha256:REPLACE_AFTER_PROMOTION
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: quay-pull-secret

service:
  port: 8080

route:
  enabled: true
  host: ""
  tls:
    termination: edge

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
