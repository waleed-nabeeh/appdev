serviceAccount:
  name: pipeline

backendBuild:
  enabled: false
  sourceUrl: https://azuredevops.mofa.gov.sa/MOFA/UnifiedVisaPlatform/_git/RedHat_UnifiedVisaPlatform.Backend
  sourceRevision: test
  imageRepository: quay-registry-prod.apps.hub-visa-ocp.mofa.gov.sa/devops
  # Empty means all 17 catalog services. Selection is applied at Helm upgrade time.
  selectedServices: []
  workspaceSize: 3Gi
  allowTestFailure: false
  buildArgs:
    - CERT_KEYWORD=dev
  dispatch:
    enabled: false
    imagePullSecrets:
      - name: registry-auth
    maxParallel: 3
    timeoutSeconds: 39600
    childTimeout: 2h0m0s
    gitops:
      enabled: false
      repository: https://azuredevops.mofa.gov.sa/MOFA/UnifiedVisaPlatform/_git/RedHat_argocd
      revision: pre-production
      valuesFile: pre-production/apps/backend.yaml
    triggers:
      enabled: false
      authRequired: true
      targetBranch: test
      authSecret: backend-pr-webhook-auth

frontendRelease:
  enabled: false
  verifyEnabled: true
  sourceUrl: https://azuredevops.mofa.gov.sa/MOFA/UnifiedVisaPlatform/_git/RedHat_UnifiedVisaPlatform.Frontend
  sourceRevision: pre-prod
  imageRepository: quay-registry-prod.apps.hub-visa-ocp.mofa.gov.sa/devops
  scanEnabled: false
  allowTestFailure: true
  gitops:
    repository: https://azuredevops.mofa.gov.sa/MOFA/UnifiedVisaPlatform/_git/RedHat_argocd
    revision: dev
    releaseFile: tekton-frontend-test/releases/frontend.json

frontendPr:
  enabled: false
  targetBranch: pre-prod
  sourceUrl: https://azuredevops.mofa.gov.sa/MOFA/UnifiedVisaPlatform/_git/RedHat_UnifiedVisaPlatform.Frontend
  proxyImage: quay-registry-prod.apps.hub-visa-ocp.mofa.gov.sa/devops/nginx-unprivileged:1.28.1-alpine3.23
  webhookAuthSecretName: frontend-pr-webhook-auth
  gitops:
    repository: ""
    revision: dev
    valuesFile: development/apps/core-apps.yaml

proxy:
  secretName: pipeline-proxy

images:
  git: docker.io/alpine/git:latest
  dotnet: registry.access.redhat.com/ubi9/dotnet-100:latest
  nodejs24: registry.access.redhat.com/ubi9/nodejs-24:latest
  buildah: registry.redhat.io/rhel9/buildah:latest
  skopeo: registry.redhat.io/rhel9/skopeo:latest
  rhacs: registry.redhat.io/advanced-cluster-security/rhacs-roxctl-rhel9:4.11
  rhtasClientServer: registry.redhat.io/rhtas/client-server-rhel9@sha256:3d08a27f79bda1f19369786723cb8d1e130c3d46cbb8a7f44e30571d5a213240

rhtas:
  audience: trusted-artifact-signer
  clientUrl: http://cli-server.trusted-artifact-signer.svc:8080
  certificateIdentityRegexp: ^https://kubernetes.io/namespaces/customer-cicd/serviceaccounts/pipeline$
  certificateOidcIssuer: https://kubernetes.default.svc
  fulcioUrl: https://fulcio-server-trusted-artifact-signer.apps.example.com
  rekorUrl: https://rekor-server-trusted-artifact-signer.apps.example.com
  tufUrl: https://tuf-trusted-artifact-signer.apps.example.com

rhacs:
  insecureSkipTLSVerify: false
