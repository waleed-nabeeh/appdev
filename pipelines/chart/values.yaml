serviceAccount:
  name: pipeline

applicationBuild:
  singleRun: false

externalSecrets:
  enabled: false
  apiVersion: external-secrets.io/v1
  secretStoreName: vault-backend
  refreshInterval: 1m
  secrets:
    - {name: git-credentials, remoteKey: devops/pipelines/git-credentials}
    - {name: registry-auth, remoteKey: devops/pipelines/registry-auth}
    - {name: npm-auth, remoteKey: devops/pipelines/npm-auth}
    - {name: rhacs-auth, remoteKey: devops/pipelines/rhacs-auth}
    - {name: pipeline-proxy, remoteKey: devops/pipelines/pipeline-proxy}
    - {name: dmz-build-ssh, remoteKey: devops/pipelines/dmz-build-ssh}

versioning:
  enabled: false
  repository: https://azuredevops.mofa.gov.sa/MOFA/UnifiedVisaPlatform/_git/RedHat_HelmCharts
  revision: ocp
  directory: versioning
  environment: preprod
  initialVersion: 1.0.0
  createTags: true
  bump: AUTO
  apiVersion: "6.0"

pvcCleanup:
  enabled: false
  schedule: "0 3 * * 5"
  timeZone: Asia/Riyadh
  dryRun: false

applicationPromotion:
  enabled: false
  gitops:
    repository: https://azuredevops.mofa.gov.sa/MOFA/UnifiedVisaPlatform/_git/RedHat_HelmCharts
    revision: dev
  sourcePrefix: "pre-"
  targets:
    - name: prod
      applicationPrefix: "pre-"
    - name: dr
      applicationPrefix: "pre-"
  backend:
    sourceFile: app-chart/backend.yaml
    prodFile: app-chart/prod-backend.yaml
    drFile: app-chart/dr-backend.yaml
  frontend:
    sourceFile: app-chart/frontend.yaml
    prodFile: app-chart/prod-frontend.yaml
    drFile: app-chart/dr-frontend.yaml

backendBuild:
  enabled: false
  testsEnabled: true
  env: dev
  sourceUrl: https://azuredevops.mofa.gov.sa/MOFA/UnifiedVisaPlatform/_git/RedHat_UnifiedVisaPlatform.Backend
  sourceRevision: test
  imageRepository: quay-registry-prod.apps.hub-visa-ocp.mofa.gov.sa/devops
  # Empty means all 17 catalog services. Selection is applied at Helm upgrade time.
  selectedServices: []
  workspaceSize: 3Gi
  allowTestFailure: false
  buildArgs:
    - CERT_KEYWORD=dev
  dispatch:
    enabled: false
    imagePullSecrets:
      - name: registry-auth
    maxParallel: 3
    timeoutSeconds: 39600
    childTimeout: 2h0m0s
    gitops:
      enabled: false
      repository: https://azuredevops.mofa.gov.sa/MOFA/UnifiedVisaPlatform/_git/RedHat_HelmCharts
      revision: dev
      valuesFile: app-chart/backend.yaml
      applicationNamePrefix: ""
      applicationNameSuffix: "-dev"
    triggers:
      enabled: false
      authRequired: true
      targetBranch: test
      authSecret: backend-pr-webhook-auth

frontendRelease:
  enabled: false
  testsEnabled: true
  env: dev
  selectedServices: []
  workspaceSize: 3Gi
  buildArgs:
    - BUILD_ENVIRONMENT=dev
  dispatch:
    enabled: false
    imagePullSecrets:
      - name: registry-auth
    maxParallel: 3
    timeoutSeconds: 39600
    childTimeout: 2h0m0s
    gitops:
      enabled: false
      repository: https://azuredevops.mofa.gov.sa/MOFA/UnifiedVisaPlatform/_git/RedHat_HelmCharts
      revision: dev
      valuesFile: app-chart/frontend.yaml
      applicationNamePrefix: ""
      applicationNameSuffix: "-dev"
    triggers:
      enabled: false
      authRequired: true
      targetBranch: pre-prod
      authSecret: frontend-pr-webhook-auth
  verifyEnabled: true
  sourceUrl: https://azuredevops.mofa.gov.sa/MOFA/UnifiedVisaPlatform/_git/RedHat_UnifiedVisaPlatform.Frontend
  sourceRevision: pre-prod
  imageRepository: quay-registry-prod.apps.hub-visa-ocp.mofa.gov.sa/devops
  scanEnabled: false
  allowTestFailure: true
  gitops:
    repository: https://azuredevops.mofa.gov.sa/MOFA/UnifiedVisaPlatform/_git/RedHat_argocd
    revision: dev
    releaseFile: tekton-frontend-test/releases/frontend.json
    applicationNamePrefix: ""
    applicationNameSuffix: "-dev"

frontendPr:
  enabled: false
  targetBranch: pre-prod
  sourceUrl: https://azuredevops.mofa.gov.sa/MOFA/UnifiedVisaPlatform/_git/RedHat_UnifiedVisaPlatform.Frontend
  proxyImage: quay-registry-prod.apps.hub-visa-ocp.mofa.gov.sa/devops/nginx-unprivileged:1.28.1-alpine3.23
  webhookAuthSecretName: frontend-pr-webhook-auth
  gitops:
    repository: ""
    revision: dev
    valuesFile: development/apps/core-apps.yaml

proxy:
  secretName: pipeline-proxy

images:
  helm: docker.io/alpine/helm:3.19.0
  git: docker.io/alpine/git:latest
  dotnet: registry.access.redhat.com/ubi9/dotnet-100:latest
  nodejs24: registry.access.redhat.com/ubi9/nodejs-24:latest
  buildah: registry.redhat.io/rhel9/buildah:latest
  skopeo: registry.redhat.io/rhel9/skopeo:latest
  rhacs: registry.redhat.io/advanced-cluster-security/rhacs-roxctl-rhel9:4.11
  rhtasClientServer: registry.redhat.io/rhtas/client-server-rhel9@sha256:3d08a27f79bda1f19369786723cb8d1e130c3d46cbb8a7f44e30571d5a213240

rhtas:
  audience: trusted-artifact-signer
  clientUrl: http://cli-server.trusted-artifact-signer.svc:8080
  certificateIdentityRegexp: ^https://kubernetes.io/namespaces/customer-cicd/serviceaccounts/pipeline$
  certificateOidcIssuer: https://kubernetes.default.svc
  fulcioUrl: https://fulcio-server-trusted-artifact-signer.apps.example.com
  rekorUrl: https://rekor-server-trusted-artifact-signer.apps.example.com
  tufUrl: https://tuf-trusted-artifact-signer.apps.example.com

rhacs:
  insecureSkipTLSVerify: false

# Prebuilt JDBC/provider JARs; no external package downloads or proxy Secret.
keycloakBuild:
  enabled: false
  allowSecurityGateFailure: false
  sourceUrl: https://azuredevops.mofa.gov.sa/MOFA/UnifiedVisaPlatform/_git/integration-rhsso
  sourceRevision: keycloak-custom
  imageRepository: quay-registry-prod.apps.hub-visa-ocp.mofa.gov.sa/devops/keycloak-custom
  baseImage: quay-registry-prod.apps.hub-visa-ocp.mofa.gov.sa/devops/keycloak-rhel9:26.6
  workspaceSize: 3Gi

# Manual single-chart validation, packaging and OCI publication; no deployment.
foundationCi:
  enabled: false
  sourceUrl: https://azuredevops.mofa.gov.sa/MOFA/UnifiedVisaPlatform/_git/RedHat_HelmCharts
  sourceRevision: dev
  chartPath: app-chart/1.0.0
  chartVersion: 1.0.1-test.1
  registry: oci://quay-registry-prod.apps.hub-visa-ocp.mofa.gov.sa/devops
  workspaceSize: 1Gi

# Only image build/push runs on the VM; all other stages stay on Hub.
remoteBuild:
  enabled: false
  useForApplicationBuilds: false
  frontendDiagnosticImage: ""
  # User-level NuGet configuration in the current Red Hat .NET SDK image.
  nugetUserConfigPath: /opt/app-root/.nuget/NuGet/NuGet.Config
  host: 172.28.50.40
  user: appdevpipeline
  port: 22
  sshSecretName: dmz-build-ssh
  hostKeyPolicy: strict
  tlsVerify: true
  proxy:
    enabled: false
    secretName: pipeline-proxy
  # Relative to the SSH account home; alternatively set the approved absolute path.
  workRoot: tekton-builds
  maxParallel: 4
  waitSeconds: 10800
