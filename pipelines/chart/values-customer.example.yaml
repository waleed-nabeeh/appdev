images:
  git: registry.customer.example/alpine/git@sha256:REPLACE
  dotnet: registry.customer.example/ubi9/dotnet-100@sha256:REPLACE
  nodejs24: registry.customer.example/devops/nodejs-24@sha256:REPLACE
  buildah: registry.customer.example/rhel9/buildah@sha256:REPLACE
  skopeo: registry.customer.example/rhel9/skopeo@sha256:REPLACE
  rhacs: registry.customer.example/rhacs/rhacs-roxctl-rhel9@sha256:REPLACE
  rhtasClientServer: registry.customer.example/rhtas/client-server-rhel9@sha256:REPLACE

rhtas:
  audience: trusted-artifact-signer
  clientUrl: http://cli-server.trusted-artifact-signer.svc:8080
  certificateIdentityRegexp: ^https://kubernetes.io/namespaces/customer-cicd/serviceaccounts/pipeline$
  certificateOidcIssuer: https://kubernetes.default.svc
  fulcioUrl: https://fulcio-server-trusted-artifact-signer.apps.CUSTOMER_DOMAIN
  rekorUrl: https://rekor-server-trusted-artifact-signer.apps.CUSTOMER_DOMAIN
  tufUrl: https://tuf-trusted-artifact-signer.apps.CUSTOMER_DOMAIN

proxy:
  secretName: pipeline-proxy

frontendPr:
  enabled: true
  targetBranch: pre-prod
  sourceUrl: https://azuredevops.mofa.gov.sa/MOFA/UnifiedVisaPlatform/_git/RedHat_UnifiedVisaPlatform.Frontend
  proxyImage: registry.customer.example/nginx-unprivileged@sha256:REPLACE
  webhookAuthSecretName: frontend-pr-webhook-auth
  gitops:
    repository: https://azuredevops.mofa.gov.sa/MOFA/UnifiedVisaPlatform/_git/RedHat_argocd
    revision: dev
    valuesFile: development/apps/core-apps.yaml
