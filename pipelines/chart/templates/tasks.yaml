apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: clone
spec:
  params:
    - name: url
      type: string
    - name: revision
      type: string
      default: develop
  workspaces:
    - name: source
    - name: git-credentials
      optional: true
  steps:
    - name: clone
      image: {{ .Values.images.git }}
      env:
        - name: HOME
          value: /tekton/home
      script: |
        #!/bin/sh
        set -euo pipefail
        rm -rf "$(workspaces.source.path)"/source
        if [ "$(workspaces.git-credentials.bound)" = "true" ]; then
          cp -R "$(workspaces.git-credentials.path)"/. "$HOME"/
          chmod -R go-rwx "$HOME"
          if [ -f "$HOME/.git-credentials" ]; then
            git config --global credential.helper store
          fi
        fi
        git clone --branch "$(params.revision)" --single-branch \
          "$(params.url)" "$(workspaces.source.path)/source"
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: unit-test
spec:
  params:
    - name: project
      type: string
    - name: http-proxy
      type: string
      default: ""
    - name: https-proxy
      type: string
      default: ""
    - name: no-proxy
      type: string
      default: ""
  workspaces:
    - name: source
  steps:
    - name: test
      image: {{ .Values.images.dotnet }}
      workingDir: $(workspaces.source.path)/source
      env:
        - name: HTTP_PROXY
          value: $(params.http-proxy)
        - name: HTTPS_PROXY
          value: $(params.https-proxy)
        - name: NO_PROXY
          value: $(params.no-proxy)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        echo "Starting NuGet restore for $(params.project)"
        dotnet restore "$(params.project)" --disable-parallel --verbosity normal
        echo "Starting tests for $(params.project)"
        dotnet test "$(params.project)" --no-restore --configuration Release --logger "console;verbosity=normal"
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: build-image
spec:
  params:
    - name: image
      type: string
    - name: context
      type: string
      default: .
    - name: containerfile
      type: string
      default: Containerfile
    - name: build-args
      type: array
      default: []
    - name: http-proxy
      type: string
      default: ""
    - name: https-proxy
      type: string
      default: ""
    - name: no-proxy
      type: string
      default: ""
  results:
    - name: image-digest
    - name: image-url
  workspaces:
    - name: source
    - name: registry-auth
  steps:
    - name: build-and-push
      image: {{ .Values.images.buildah }}
      securityContext:
        capabilities:
          add: [SETFCAP]
      workingDir: $(workspaces.source.path)/source
      env:
        - name: HTTP_PROXY
          value: $(params.http-proxy)
        - name: HTTPS_PROXY
          value: $(params.https-proxy)
        - name: NO_PROXY
          value: $(params.no-proxy)
        - name: http_proxy
          value: $(params.http-proxy)
        - name: https_proxy
          value: $(params.https-proxy)
        - name: no_proxy
          value: $(params.no-proxy)
      args: ["$(params.build-args[*])"]
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        build_args=()
        for argument in "$@"; do
          build_args+=(--build-arg "$argument")
        done
        authfile="$(workspaces.registry-auth.path)/config.json"
        if [ ! -f "$authfile" ] && [ -f "$(workspaces.registry-auth.path)/.dockerconfigjson" ]; then
          authfile="$(workspaces.registry-auth.path)/.dockerconfigjson"
        fi
        test -f "$authfile"
        buildah --storage-driver=vfs bud \
          --authfile "$authfile" \
          "${build_args[@]}" \
          -f "$(params.containerfile)" -t "$(params.image)" "$(params.context)"
        digest=$(buildah --storage-driver=vfs push \
          --authfile "$authfile" \
          --digestfile /tmp/digest \
          "$(params.image)" "docker://$(params.image)" && cat /tmp/digest)
        printf '%s' "$digest" > "$(results.image-digest.path)"
        printf '%s' "$(params.image)@$digest" > "$(results.image-url.path)"
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: scan-image
spec:
  params:
    - name: image
      type: string
  results:
    - name: scan-result
  steps:
    - name: scan
      image: {{ .Values.images.rhacs }}
      env:
        - name: HOME
          value: /tekton/home
        - name: ROX_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: rhacs-auth
              key: endpoint
        - name: ROX_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: rhacs-auth
              key: token
        - name: ROX_INSECURE_CLIENT_SKIP_TLS_VERIFY
          value: {{ .Values.rhacs.insecureSkipTLSVerify | quote }}
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        for attempt in $(seq 1 30); do
          if roxctl image scan --image "$(params.image)" --output json > /tmp/scan.json; then
            break
          fi
          if [[ "$attempt" == "30" ]]; then
            echo "RHACS scan did not complete within the retry window" >&2
            exit 1
          fi
          sleep 20
        done
        printf 'passed' > "$(results.scan-result.path)"
---
apiVersion: tekton.dev/v1
