apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: clone
spec:
  params:
    - name: url
      type: string
    - name: revision
      type: string
      default: develop
    - name: commit
      type: string
      default: ""
  workspaces:
    - name: source
    - name: git-credentials
      optional: true
  steps:
    - name: clone
      image: {{ .Values.images.git }}
      env:
        - name: HOME
          value: /tekton/home
      script: |
        #!/bin/sh
        set -euo pipefail
        rm -rf "$(workspaces.source.path)"/source
        if [ "$(workspaces.git-credentials.bound)" = "true" ]; then
          cp -R "$(workspaces.git-credentials.path)"/. "$HOME"/
          chmod -R go-rwx "$HOME"
          if [ -f "$HOME/.git-credentials" ]; then
            git config --global credential.helper store
          fi
        fi
        REVISION="$(params.revision)"
        case "$REVISION" in
          refs/heads/*) REVISION="${REVISION#refs/heads/}" ;;
        esac
        git clone --branch "$REVISION" --single-branch \
          "$(params.url)" "$(workspaces.source.path)/source"
        if [ -n "$(params.commit)" ]; then
          git -C "$(workspaces.source.path)/source" fetch --depth=1 origin "$(params.commit)"
          git -C "$(workspaces.source.path)/source" checkout --detach FETCH_HEAD
        fi
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: frontend-pr-dispatch
spec:
  params:
    - name: source-url
      type: string
    - name: source-revision
      type: string
    - name: source-commit
      type: string
    - name: target-ref
      type: string
    - name: selection-mode
      type: string
      default: diff
    - name: config-file
      type: string
      default: service-pre-prod.tsv
  workspaces:
    - name: source
    - name: git-credentials
      optional: true
    - name: service-config
  results:
    - name: run-admin-portal
      description: Whether the admin portal lane should run
    - name: run-applicant-portal
      description: Whether the applicant portal lane should run
    - name: run-operational-portal
      description: Whether the operational portal lane should run
  steps:
    - name: select-services
      image: {{ .Values.images.git }}
      env:
        - name: HOME
          value: /tekton/home
      script: |
        #!/bin/sh
        set -eu
        REPO="$(workspaces.source.path)/repo"
        if [ "$(workspaces.git-credentials.bound)" = "true" ]; then
          cp -R "$(workspaces.git-credentials.path)"/. "$HOME"/
          chmod -R go-rwx "$HOME"
          if [ -f "$HOME/.git-credentials" ]; then
            git config --global credential.helper store
          fi
        fi

        REVISION="$(params.source-revision)"
        case "$REVISION" in
          refs/heads/*) REVISION="${REVISION#refs/heads/}" ;;
        esac
        git init "$REPO"
        git -C "$REPO" remote add origin "$(params.source-url)"
        git -C "$REPO" fetch --depth=100 origin "$REVISION"
        git -C "$REPO" fetch --depth=100 origin "$(params.source-commit)"
        git -C "$REPO" checkout --detach FETCH_HEAD

        RUN_ADMIN=false
        RUN_APPLICANT=false
        RUN_OPERATIONAL=false
        if [ "$(params.selection-mode)" = "all" ]; then
          RUN_ADMIN=true
          RUN_APPLICANT=true
          RUN_OPERATIONAL=true
        elif [ "$(params.selection-mode)" = "diff" ]; then
          CONFIG="$(workspaces.service-config.path)/$(params.config-file)"
          test -s "$CONFIG" || { echo "Missing or empty service map: $CONFIG" >&2; exit 1; }
          git -C "$REPO" fetch --depth=100 origin "+$(params.target-ref):refs/remotes/origin/pr-target"
          BASE=`git -C "$REPO" merge-base refs/remotes/origin/pr-target HEAD || true`
          if [ -z "$BASE" ]; then
            echo "Could not find PR merge base; running all portals conservatively"
            RUN_ADMIN=true
            RUN_APPLICANT=true
            RUN_OPERATIONAL=true
          else
            git -C "$REPO" diff --name-only "$BASE" HEAD > /tmp/changed-files
            while read -r changed; do
              [ -n "$changed" ] || continue
              MATCHED=false
              while read -r service path; do
                case "$service" in ""|\#*) continue ;; esac
                case "$changed" in
                  "$path"|"$path"/*)
                    MATCHED=true
                    case "$service" in
                      admin-portal) RUN_ADMIN=true ;;
                      applicant-portal) RUN_APPLICANT=true ;;
                      operational-portal) RUN_OPERATIONAL=true ;;
                      *) echo "Unknown service in map: $service" >&2; exit 1 ;;
                    esac
                    ;;
                esac
              done < "$CONFIG"
              if [ "$MATCHED" != true ]; then
                echo "Unmapped changed path '$changed'; running all portals conservatively"
                RUN_ADMIN=true
                RUN_APPLICANT=true
                RUN_OPERATIONAL=true
              fi
            done < /tmp/changed-files
          fi
        else
          echo "selection-mode must be 'diff' or 'all'" >&2
          exit 1
        fi

        printf '%s' "$RUN_ADMIN" > "$(results.run-admin-portal.path)"
        printf '%s' "$RUN_APPLICANT" > "$(results.run-applicant-portal.path)"
        printf '%s' "$RUN_OPERATIONAL" > "$(results.run-operational-portal.path)"
        echo "Selected lanes: admin=$RUN_ADMIN applicant=$RUN_APPLICANT operational=$RUN_OPERATIONAL"
      workingDir: $(workspaces.source.path)
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: unit-test
spec:
  params:
    - name: project
      type: string
  workspaces:
    - name: source
  steps:
    - name: test
      image: {{ .Values.images.dotnet }}
      workingDir: $(workspaces.source.path)/source
      env:
        - name: HTTP_PROXY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.proxy.secretName }}
              key: HTTP_PROXY
        - name: HTTPS_PROXY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.proxy.secretName }}
              key: HTTPS_PROXY
        - name: NO_PROXY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.proxy.secretName }}
              key: NO_PROXY
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        echo "Starting NuGet restore for $(params.project)"
        dotnet restore "$(params.project)" --disable-parallel --verbosity normal
        echo "Starting tests for $(params.project)"
        dotnet test "$(params.project)" --no-restore --configuration Release --logger "console;verbosity=normal"
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: frontend-unit-test
spec:
  params:
    - name: project
      type: string
      default: admin-portal
  workspaces:
    - name: source
    - name: npm-auth
  steps:
    - name: test
      image: {{ .Values.images.nodejs24 | quote }}
      workingDir: $(workspaces.source.path)/source
      env:
        - name: HTTP_PROXY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.proxy.secretName }}
              key: HTTP_PROXY
        - name: HTTPS_PROXY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.proxy.secretName }}
              key: HTTPS_PROXY
        - name: NO_PROXY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.proxy.secretName }}
              key: NO_PROXY
        - name: http_proxy
          valueFrom:
            secretKeyRef:
              name: {{ .Values.proxy.secretName }}
              key: HTTP_PROXY
        - name: https_proxy
          valueFrom:
            secretKeyRef:
              name: {{ .Values.proxy.secretName }}
              key: HTTPS_PROXY
        - name: no_proxy
          valueFrom:
            secretKeyRef:
              name: {{ .Values.proxy.secretName }}
              key: NO_PROXY
        - name: CI
          value: "true"
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        test -s "$(workspaces.npm-auth.path)/NPM_TOKEN"
        umask 077
        token="$(cat "$(workspaces.npm-auth.path)/NPM_TOKEN")"
        encoded_token="$(printf '%s' "$token" | base64 | tr -d '\n')"
        unset token
        npmrc="$(mktemp)"
        npm_cache="$(mktemp -d)"
        cleanup() { rm -f "$npmrc"; rm -rf "$npm_cache"; }
        trap cleanup EXIT
        export NPM_CONFIG_USERCONFIG="$npmrc"
        export npm_config_cache="$npm_cache"
        feed_url="https://azuredevops.mofa.gov.sa/MOFA/UnifiedVisaPlatform/_packaging/uvisaLocal/npm/registry/"
        feed="//azuredevops.mofa.gov.sa/MOFA/UnifiedVisaPlatform/_packaging/uvisaLocal/npm"
        {
          echo "registry=https://registry.npmjs.org/"
          echo "strict-ssl=false"
          echo "@gs-ui:registry=${feed_url}"
          echo "@gs:registry=${feed_url}"
          echo "@gs-utils:registry=${feed_url}"
          echo "@gs-shared:registry=${feed_url}"
          echo "@library:registry=${feed_url}"
          echo "@gs-theme:registry=${feed_url}"
          echo "${feed}/registry/:username=MOFA"
          echo "${feed}/registry/:_password=${encoded_token}"
          echo "${feed}/registry/:email=ci@mofa.gov.sa"
          echo "${feed}/:username=MOFA"
          echo "${feed}/:_password=${encoded_token}"
          echo "${feed}/:email=ci@mofa.gov.sa"
        } > "$npmrc"
        npm install --prefer-offline
        npm install --no-save @nx/nx-linux-x64-gnu @rollup/rollup-linux-x64-gnu
        npx nx test "$(params.project)"
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: build-image
spec:
  params:
    - name: image
      type: string
    - name: context
      type: string
      default: .
    - name: containerfile
      type: string
      default: Containerfile
    - name: build-args
      type: array
      default: []
  results:
    - name: image-digest
    - name: image-url
  workspaces:
    - name: source
    - name: registry-auth
    - name: npm-auth
      optional: true
  steps:
    - name: build-and-push
      image: {{ .Values.images.buildah }}
      securityContext:
        capabilities:
          add: [SETFCAP]
      workingDir: $(workspaces.source.path)/source
      env:
        - name: HTTP_PROXY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.proxy.secretName }}
              key: HTTP_PROXY
        - name: HTTPS_PROXY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.proxy.secretName }}
              key: HTTPS_PROXY
        - name: NO_PROXY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.proxy.secretName }}
              key: NO_PROXY
        - name: http_proxy
          valueFrom:
            secretKeyRef:
              name: {{ .Values.proxy.secretName }}
              key: HTTP_PROXY
        - name: https_proxy
          valueFrom:
            secretKeyRef:
              name: {{ .Values.proxy.secretName }}
              key: HTTPS_PROXY
        - name: no_proxy
          valueFrom:
            secretKeyRef:
              name: {{ .Values.proxy.secretName }}
              key: NO_PROXY
      args: ["$(params.build-args[*])"]
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        build_args=()
        for argument in "$@"; do
          build_args+=(--build-arg "$argument")
        done
        build_args+=(--build-arg "HTTP_PROXY=$HTTP_PROXY")
        build_args+=(--build-arg "HTTPS_PROXY=$HTTPS_PROXY")
        build_args+=(--build-arg "NO_PROXY=$NO_PROXY")
        build_secrets=()
        if [ "$(workspaces.npm-auth.bound)" = "true" ]; then
          npm_token="$(workspaces.npm-auth.path)/NPM_TOKEN"
          if [ ! -s "$npm_token" ]; then
            echo "npm-auth must contain a non-empty NPM_TOKEN key" >&2
            exit 1
          fi
          build_secrets+=(--secret "id=npm_token,src=$npm_token")
        fi
        authfile="$(workspaces.registry-auth.path)/config.json"
        if [ ! -f "$authfile" ] && [ -f "$(workspaces.registry-auth.path)/.dockerconfigjson" ]; then
          authfile="$(workspaces.registry-auth.path)/.dockerconfigjson"
        fi
        test -f "$authfile"
        buildah --storage-driver=vfs bud \
          --authfile "$authfile" \
          "${build_args[@]}" \
          "${build_secrets[@]}" \
          -f "$(params.containerfile)" -t "$(params.image)" "$(params.context)"
        digest=$(buildah --storage-driver=vfs push \
          --authfile "$authfile" \
          --digestfile /tmp/digest \
          "$(params.image)" "docker://$(params.image)" && cat /tmp/digest)
        printf '%s' "$digest" > "$(results.image-digest.path)"
        printf '%s' "$(params.image)@$digest" > "$(results.image-url.path)"
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: scan-image
spec:
  params:
    - name: image
      type: string
  results:
    - name: scan-result
  steps:
    - name: scan
      image: {{ .Values.images.rhacs }}
      env:
        - name: HOME
          value: /tekton/home
        - name: ROX_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: rhacs-auth
              key: endpoint
        - name: ROX_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: rhacs-auth
              key: token
        - name: ROX_INSECURE_CLIENT_SKIP_TLS_VERIFY
          value: {{ .Values.rhacs.insecureSkipTLSVerify | quote }}
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        for attempt in $(seq 1 30); do
          if roxctl image scan --image "$(params.image)" --output json > /tmp/scan.json; then
            break
          fi
          if [[ "$attempt" == "30" ]]; then
            echo "RHACS scan did not complete within the retry window" >&2
            exit 1
          fi
          sleep 20
        done
        printf 'passed' > "$(results.scan-result.path)"
---
