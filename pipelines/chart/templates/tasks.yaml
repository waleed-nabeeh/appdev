apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: sign-image
spec:
  params:
    - name: image
      type: string
    - name: fulcio-url
      type: string
    - name: rekor-url
      type: string
    - name: tuf-url
      type: string
    - name: client-url
      type: string
  steps:
    - name: sign
      image: {{ .Values.images.rhtasClientServer }}
      env:
        - name: HOME
          value: /tekton/home
      computeResources: {}
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        authfile="$(workspaces.registry-auth.path)/config.json"
        if [ ! -f "$authfile" ] && [ -f "$(workspaces.registry-auth.path)/.dockerconfigjson" ]; then
          authfile="$(workspaces.registry-auth.path)/.dockerconfigjson"
        fi
        if [ ! -s "$authfile" ]; then
          echo "registry-auth must contain config.json or .dockerconfigjson" >&2
          exit 1
        fi
        export DOCKER_CONFIG="$(mktemp -d)"
        cp "$authfile" "$DOCKER_CONFIG/config.json"
        chmod 600 "$DOCKER_CONFIG/config.json"
        curl --fail --silent --show-error --location \
          "$(params.client-url)/clients/linux/cosign-amd64.gz" \
          --output /tmp/rhtas-cosign.gz
        gzip --decompress /tmp/rhtas-cosign.gz
        chmod +x /tmp/rhtas-cosign
        /tmp/rhtas-cosign version
        /tmp/rhtas-cosign initialize --mirror="$(params.tuf-url)" --root="$(params.tuf-url)/root.json"
        /tmp/rhtas-cosign sign --yes \
          --use-signing-config=false \
          --identity-token="$(cat /var/run/sigstore/token)" \
          --fulcio-url="$(params.fulcio-url)" \
          --rekor-url="$(params.rekor-url)" \
          "$(params.image)"
      volumeMounts:
        - name: oidc-token
          mountPath: /var/run/sigstore
          readOnly: true
  volumes:
    - name: oidc-token
      projected:
        sources:
          - serviceAccountToken:
              path: token
              audience: {{ .Values.rhtas.audience }}
              expirationSeconds: 600
  workspaces:
    - name: registry-auth
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: get-approved-image
spec:
  params:
    - name: repository
      type: string
    - name: tag
      type: string
  results:
    - name: image-digest
    - name: image-url
  workspaces:
    - name: registry-auth
  steps:
    - name: resolve
      image: {{ .Values.images.skopeo }}
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        image="$(params.repository):$(params.tag)"
        authfile="$(workspaces.registry-auth.path)/config.json"
        if [ ! -f "$authfile" ] && [ -f "$(workspaces.registry-auth.path)/.dockerconfigjson" ]; then
          authfile="$(workspaces.registry-auth.path)/.dockerconfigjson"
        fi
        test -f "$authfile"
        digest="$(skopeo inspect \
          --authfile "$authfile" \
          --format '{{`{{.Digest}}`}}' "docker://${image}")"
        test -n "$digest"
        printf '%s' "$digest" > "$(results.image-digest.path)"
        printf '%s' "$(params.repository)@${digest}" > "$(results.image-url.path)"
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: verify-image
spec:
  params:
    - name: image
      type: string
    - name: tuf-url
      type: string
    - name: client-url
      type: string
    - name: certificate-identity-regexp
      type: string
    - name: certificate-oidc-issuer
      type: string
  workspaces:
    - name: registry-auth
  steps:
    - name: verify
      image: {{ .Values.images.rhtasClientServer }}
      env:
        - name: HOME
          value: /tekton/home
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        authfile="$(workspaces.registry-auth.path)/config.json"
        if [ ! -f "$authfile" ] && [ -f "$(workspaces.registry-auth.path)/.dockerconfigjson" ]; then
          authfile="$(workspaces.registry-auth.path)/.dockerconfigjson"
        fi
        if [ ! -s "$authfile" ]; then
          echo "registry-auth must contain config.json or .dockerconfigjson" >&2
          exit 1
        fi
        export DOCKER_CONFIG="$(mktemp -d)"
        cp "$authfile" "$DOCKER_CONFIG/config.json"
        chmod 600 "$DOCKER_CONFIG/config.json"
        curl --fail --silent --show-error --location \
          "$(params.client-url)/clients/linux/cosign-amd64.gz" \
          --output /tmp/rhtas-cosign-verify.gz
        gzip --decompress /tmp/rhtas-cosign-verify.gz
        chmod +x /tmp/rhtas-cosign-verify
        /tmp/rhtas-cosign-verify initialize \
          --mirror="$(params.tuf-url)" \
          --root="$(params.tuf-url)/root.json"
        /tmp/rhtas-cosign-verify verify \
          --certificate-identity-regexp="$(params.certificate-identity-regexp)" \
          --certificate-oidc-issuer="$(params.certificate-oidc-issuer)" \
          "$(params.image)"
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: update-helm-chart
spec:
  params:
    - name: repository
      type: string
    - name: revision
      type: string
      default: develop
    - name: values-file
      type: string
    - name: image
      type: string
    - name: image-digest
      type: string
  workspaces:
    - name: git-credentials
      optional: true
  steps:
    - name: update
      image: {{ .Values.images.git }}
      env:
        - name: HOME
          value: /tekton/home
      script: |
        #!/bin/sh
        set -euo pipefail
        if [ -f "$(workspaces.git-credentials.path)/id_ed25519" ]; then
          mkdir -p "$HOME/.ssh"
          cp "$(workspaces.git-credentials.path)/id_ed25519" "$HOME/.ssh/id_ed25519"
          cp "$(workspaces.git-credentials.path)/known_hosts" "$HOME/.ssh/known_hosts"
          cp "$(workspaces.git-credentials.path)/ssh_config" "$HOME/.ssh/config"
          export GIT_SSH_COMMAND="ssh -F $HOME/.ssh/config -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
        else
          cp -R "$(workspaces.git-credentials.path)"/. "$HOME"/
          if [ -f "$HOME/.git-credentials" ]; then
            git config --global credential.helper store
          fi
        fi
        chmod -R go-rwx "$HOME"
        git config --global user.name "Customer Pipeline"
        git config --global user.email "pipeline@customer.invalid"
        git clone --branch "$(params.revision)" "$(params.repository)" /tmp/gitops
        cd /tmp/gitops
        sed -i "s|^[[:space:]]*repository:.*|  repository: $(params.image)|" "$(params.values-file)"
        sed -i "s|^[[:space:]]*digest:.*|  digest: $(params.image-digest)|" "$(params.values-file)"
        git add "$(params.values-file)"
        git diff --cached --quiet && exit 0
        git commit -m "Update application image to $(params.image-digest)"
        git push origin "HEAD:$(params.revision)"
