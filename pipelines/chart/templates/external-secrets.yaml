{{- if .Values.externalSecrets.enabled }}
{{- $settings := .Values.externalSecrets }}
{{- if not (has $settings.apiVersion (list "external-secrets.io/v1" "external-secrets.io/v1beta1")) }}
{{- fail "externalSecrets.apiVersion must be external-secrets.io/v1 or v1beta1 as served by the installed CRD" }}
{{- end }}
{{- $seen := list }}
{{- range $secret := $settings.secrets }}
{{- if or (not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" $secret.name)) (gt (len $secret.name) 48) }}
{{- fail "externalSecrets names must be DNS labels of at most 48 characters" }}
{{- end }}
{{- if has $secret.name $seen }}
{{- fail (printf "Duplicate externalSecrets target: %s" $secret.name) }}
{{- end }}
{{- $seen = append $seen $secret.name }}
---
apiVersion: {{ $settings.apiVersion }}
kind: ExternalSecret
metadata:
  name: pipeline-vault-{{ $secret.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: application-build
    app.kubernetes.io/component: vault-secret-sync
spec:
  refreshInterval: {{ required "externalSecrets.refreshInterval is required" $settings.refreshInterval | quote }}
  secretStoreRef:
    name: {{ required "externalSecrets.secretStoreName is required" $settings.secretStoreName | quote }}
    kind: SecretStore
  target:
    name: {{ $secret.name | quote }}
    creationPolicy: Merge
    deletionPolicy: Retain
    # Explicit target metadata prevents copying Helm ownership annotations from
    # this ExternalSecret onto a pre-existing credential Secret.
    template:
      metadata:
        labels:
          customer.mofa.gov.sa/credential-source: vault
  dataFrom:
    - extract:
        key: {{ required "Every externalSecrets item needs remoteKey" $secret.remoteKey | quote }}
        decodingStrategy: None
{{- end }}
{{- end }}
