{{- if .Values.remoteBuild.enabled }}
{{- if not (has .Values.remoteBuild.hostKeyPolicy (list "strict" "accept-new")) }}
{{- fail "remoteBuild.hostKeyPolicy must be strict or accept-new" }}
{{- end }}
{{- if not (regexMatch "^[1-9][0-9]*$" (toString .Values.remoteBuild.maxParallel)) }}
{{- fail "remoteBuild.maxParallel must be a positive integer" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: dmz-build-runner
data:
  runner.sh: |
{{ .Files.Get "files/dmz-build-runner.sh" | indent 4 }}
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: build-image-dmz
spec:
  params:
    - {name: image, type: string}
    - {name: context, type: string, default: "."}
    - {name: containerfile, type: string, default: Containerfile}
    - {name: build-args, type: array, default: []}
    - {name: diagnostic-base-image, type: string, default: ""}
    - {name: nuget-credential-url, type: string, default: ""}
  results:
    - name: image-digest
    - name: image-url
  workspaces:
    - name: source
    - name: registry-auth
    - name: npm-auth
      optional: true
    - name: nuget-auth
      optional: true
  volumes:
    - name: ssh-auth
      secret:
        secretName: {{ .Values.remoteBuild.sshSecretName }}
{{- if .Values.remoteBuild.proxy.enabled }}
    - name: dmz-proxy
      secret:
        secretName: {{ .Values.remoteBuild.proxy.secretName }}
{{- end }}
    - name: runner
      configMap:
        name: dmz-build-runner
  steps:
    - name: build-and-push-dmz
      image: {{ .Values.images.git }}
      args: ["$(params.build-args[*])"]
      volumeMounts:
        - {name: ssh-auth, mountPath: /ssh-auth, readOnly: true}
{{- if .Values.remoteBuild.proxy.enabled }}
        - {name: dmz-proxy, mountPath: /dmz-proxy, readOnly: true}
{{- end }}
        - {name: runner, mountPath: /opt/dmz-build, readOnly: true}
      env:
        - {name: DMZ_PROXY_ENABLED, value: {{ .Values.remoteBuild.proxy.enabled | quote }}}
        - {name: DMZ_TLS_VERIFY, value: {{ .Values.remoteBuild.tlsVerify | quote }}}
        - {name: DMZ_HOST_KEY_POLICY, value: {{ .Values.remoteBuild.hostKeyPolicy | quote }}}
        - {name: DMZ_HOST, value: {{ .Values.remoteBuild.host | quote }}}
        - {name: DMZ_USER, value: {{ .Values.remoteBuild.user | quote }}}
        - {name: DMZ_PORT, value: {{ .Values.remoteBuild.port | quote }}}
        - {name: DMZ_ROOT, value: {{ .Values.remoteBuild.workRoot | quote }}}
        - {name: DMZ_MAX_BUILDS, value: {{ .Values.remoteBuild.maxParallel | quote }}}
        - {name: DMZ_WAIT_SECONDS, value: {{ .Values.remoteBuild.waitSeconds | quote }}}
        - {name: JOB_ID, value: $(context.taskRun.uid)}
        - {name: SOURCE_DIR, value: $(workspaces.source.path)/source}
        - {name: REGISTRY_AUTH, value: $(workspaces.registry-auth.path)}
        - {name: NPM_AUTH_BOUND, value: $(workspaces.npm-auth.bound)}
        - {name: NPM_AUTH, value: $(workspaces.npm-auth.path)}
        - {name: NUGET_AUTH_BOUND, value: $(workspaces.nuget-auth.bound)}
        - {name: NUGET_AUTH, value: $(workspaces.nuget-auth.path)}
        - {name: NUGET_CREDENTIAL_URL, value: $(params.nuget-credential-url)}
        - {name: NUGET_USER_CONFIG_PATH, value: {{ .Values.remoteBuild.nugetUserConfigPath | quote }}}
        - {name: DIAGNOSTIC_BASE_IMAGE, value: $(params.diagnostic-base-image)}
        - {name: BUILD_IMAGE, value: $(params.image)}
        - {name: BUILD_CONTEXT, value: $(params.context)}
        - {name: CONTAINERFILE, value: $(params.containerfile)}
        - {name: RESULT_DIGEST, value: $(results.image-digest.path)}
        - {name: RESULT_IMAGE, value: $(results.image-url.path)}
      script: |
{{ .Files.Get "files/dmz-build-client.sh" | indent 8 }}
{{- end }}
