{{- if and .Values.backendBuild.enabled .Values.backendBuild.dispatch.enabled .Values.backendBuild.dispatch.triggers.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-pr-listener
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backend-pr-listener
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [tekton.dev]
    resources: [pipelineruns]
    verbs: [create]
{{- if .Values.backendBuild.dispatch.triggers.authRequired }}
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ .Values.backendBuild.dispatch.triggers.authSecret | quote }}]
    verbs: [get]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backend-pr-listener
  namespace: {{ .Release.Namespace }}
subjects:
  - {kind: ServiceAccount, name: backend-pr-listener, namespace: {{ .Release.Namespace }}}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: backend-pr-listener
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backend-pr-triggers
  namespace: {{ .Release.Namespace }}
subjects:
  - {kind: ServiceAccount, name: backend-pr-listener, namespace: {{ .Release.Namespace }}}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tekton-triggers-eventlistener-roles
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-%s-backend-pr" .Release.Namespace .Release.Name | trunc 63 | trimSuffix "-" }}
subjects:
  - {kind: ServiceAccount, name: backend-pr-listener, namespace: {{ .Release.Namespace }}}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tekton-triggers-eventlistener-clusterroles
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: backend-azure-pr
  namespace: {{ .Release.Namespace }}
spec:
  params:
    - {name: source-revision, value: $(body.resource.sourceRefName)}
    - {name: source-commit, value: $(body.resource.lastMergeSourceCommit.commitId)}
    - {name: target-commit, value: $(body.resource.lastMergeTargetCommit.commitId)}
    - {name: pr-id, value: $(extensions.pr-id)}
    - {name: source-short, value: $(extensions.source-short)}
    - {name: target-short, value: $(extensions.target-short)}
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: backend-azure-pr
  namespace: {{ .Release.Namespace }}
spec:
  params:
    - name: source-revision
    - name: source-commit
    - name: target-commit
    - name: pr-id
    - name: source-short
    - name: target-short
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        name: backend-pr-$(tt.params.pr-id)-$(tt.params.source-short)-$(tt.params.target-short)
        namespace: {{ .Release.Namespace }}
        labels:
          customer.mofa.gov.sa/trigger: azure-pr
      spec:
        pipelineRef:
          name: application-backend-dispatch
        taskRunTemplate:
          serviceAccountName: backend-dispatcher
        timeouts:
          pipeline: 12h0m0s
          tasks: 11h50m0s
        params:
          - {name: services, value: ""}
          - {name: selection-mode, value: diff}
          - {name: source-revision, value: $(tt.params.source-revision)}
          - {name: source-commit, value: $(tt.params.source-commit)}
          - {name: target-commit, value: $(tt.params.target-commit)}
        workspaces:
          - name: git-credentials
            secret:
              secretName: git-credentials
---
apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: backend-pr
  namespace: {{ .Release.Namespace }}
spec:
  serviceAccountName: backend-pr-listener
  triggers:
    - name: azure-backend-pr
      bindings:
        - ref: backend-azure-pr
      template:
        ref: backend-azure-pr
      interceptors:
        - ref:
            name: cel
          params:
            - name: filter
              value: >-
{{- if .Values.backendBuild.dispatch.triggers.authRequired }}
                header.canonical('Authorization').compareSecret('authorization', '{{ .Values.backendBuild.dispatch.triggers.authSecret }}') &&
{{- end }}
                (body.eventType == 'git.pullrequest.created' || body.eventType == 'git.pullrequest.updated') &&
                body.resource.status == 'active' &&
                body.resource.repository.remoteUrl == '{{ .Values.backendBuild.sourceUrl }}' &&
                body.resource.targetRefName == 'refs/heads/{{ trimPrefix "refs/heads/" .Values.backendBuild.dispatch.triggers.targetBranch }}' &&
                body.resource.sourceRefName.matches('^refs/heads/[A-Za-z0-9_./-]+$') &&
                body.resource.lastMergeSourceCommit.commitId.matches('^[0-9a-f]{40}$') &&
                body.resource.lastMergeTargetCommit.commitId.matches('^[0-9a-f]{40}$') &&
                string(body.resource.pullRequestId).matches('^[0-9]{1,10}$') &&
                (!has(body.resource.forkSource) || body.resource.forkSource == null)
            - name: overlays
              value:
                - key: pr-id
                  expression: string(body.resource.pullRequestId)
                - key: source-short
                  expression: body.resource.lastMergeSourceCommit.commitId.truncate(12)
                - key: target-short
                  expression: body.resource.lastMergeTargetCommit.commitId.truncate(12)
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: backend-pr-webhook
  namespace: {{ .Release.Namespace }}
spec:
  to:
    kind: Service
    name: el-backend-pr
  port:
    targetPort: http-listener
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
{{- end }}
