{{- define "application.dispatchTriggers" }}
{{- $root := .root }}
{{- $scope := .scope }}
{{- $settings := .settings }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $scope }}-pr-listener
  namespace: {{ $root.Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $scope }}-pr-listener
  namespace: {{ $root.Release.Namespace }}
rules:
  - apiGroups: [tekton.dev]
    resources: [pipelineruns]
    verbs: [create]
{{- if $settings.dispatch.triggers.authRequired }}
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ $settings.dispatch.triggers.authSecret | quote }}]
    verbs: [get]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $scope }}-pr-listener
  namespace: {{ $root.Release.Namespace }}
subjects:
  - {kind: ServiceAccount, name: {{ $scope }}-pr-listener, namespace: {{ $root.Release.Namespace }}}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $scope }}-pr-listener
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $scope }}-pr-triggers
  namespace: {{ $root.Release.Namespace }}
subjects:
  - {kind: ServiceAccount, name: {{ $scope }}-pr-listener, namespace: {{ $root.Release.Namespace }}}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tekton-triggers-eventlistener-roles
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-%s-%s-pr" $root.Release.Namespace $root.Release.Name $scope | trunc 63 | trimSuffix "-" }}
subjects:
  - {kind: ServiceAccount, name: {{ $scope }}-pr-listener, namespace: {{ $root.Release.Namespace }}}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tekton-triggers-eventlistener-clusterroles
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: {{ $scope }}-azure-pr
  namespace: {{ $root.Release.Namespace }}
spec:
  params:
    - {name: source-revision, value: $(body.resource.sourceRefName)}
    - {name: source-commit, value: $(body.resource.lastMergeSourceCommit.commitId)}
    - {name: target-commit, value: $(body.resource.lastMergeTargetCommit.commitId)}
    - {name: pr-id, value: $(extensions.pr-id)}
    - {name: source-short, value: $(extensions.source-short)}
    - {name: target-short, value: $(extensions.target-short)}
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: {{ $scope }}-azure-pr
  namespace: {{ $root.Release.Namespace }}
spec:
  params:
    - name: source-revision
    - name: source-commit
    - name: target-commit
    - name: pr-id
    - name: source-short
    - name: target-short
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        name: {{ $scope }}-pr-$(tt.params.pr-id)-$(tt.params.source-short)-$(tt.params.target-short)
        namespace: {{ $root.Release.Namespace }}
        labels:
          customer.mofa.gov.sa/trigger: azure-pr
      spec:
        pipelineRef:
          name: application-{{ $scope }}-dispatch
        taskRunTemplate:
          serviceAccountName: {{ $scope }}-dispatcher
        timeouts:
          pipeline: 12h0m0s
          tasks: 11h50m0s
        params:
          - {name: services, value: ""}
          - {name: selection-mode, value: diff}
          - {name: source-revision, value: $(tt.params.source-revision)}
          - {name: source-commit, value: $(tt.params.source-commit)}
          - {name: target-commit, value: $(tt.params.target-commit)}
        workspaces:
          - name: git-credentials
            secret:
              secretName: git-credentials
---
apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: {{ $scope }}-pr
  namespace: {{ $root.Release.Namespace }}
spec:
  serviceAccountName: {{ $scope }}-pr-listener
  triggers:
    - name: azure-{{ $scope }}-pr
      bindings:
        - ref: {{ $scope }}-azure-pr
      template:
        ref: {{ $scope }}-azure-pr
      interceptors:
        - ref:
            name: cel
          params:
            - name: filter
              value: >-
{{- if $settings.dispatch.triggers.authRequired }}
                header.canonical('Authorization').compareSecret('authorization', '{{ $settings.dispatch.triggers.authSecret }}') &&
{{- end }}
                (body.eventType == 'git.pullrequest.created' || body.eventType == 'git.pullrequest.updated') &&
                body.resource.status == 'active' &&
                body.resource.repository.remoteUrl == '{{ $settings.sourceUrl }}' &&
                body.resource.targetRefName == 'refs/heads/{{ trimPrefix "refs/heads/" $settings.dispatch.triggers.targetBranch }}' &&
                body.resource.sourceRefName.matches('^refs/heads/[A-Za-z0-9_./-]+$') &&
                body.resource.lastMergeSourceCommit.commitId.matches('^[0-9a-f]{40}$') &&
                body.resource.lastMergeTargetCommit.commitId.matches('^[0-9a-f]{40}$') &&
                string(body.resource.pullRequestId).matches('^[0-9]{1,10}$') &&
                (!has(body.resource.forkSource) || body.resource.forkSource == null)
            - name: overlays
              value:
                - key: pr-id
                  expression: string(body.resource.pullRequestId)
                - key: source-short
                  expression: body.resource.lastMergeSourceCommit.commitId.truncate(12)
                - key: target-short
                  expression: body.resource.lastMergeTargetCommit.commitId.truncate(12)
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ $scope }}-pr-webhook
  namespace: {{ $root.Release.Namespace }}
spec:
  to:
    kind: Service
    name: el-{{ $scope }}-pr
  port:
    targetPort: http-listener
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
{{- end }}

{{- if and .Values.backendBuild.enabled .Values.backendBuild.dispatch.enabled .Values.backendBuild.dispatch.triggers.enabled }}
{{ include "application.dispatchTriggers" (dict "root" . "scope" "backend" "settings" .Values.backendBuild) }}
{{- end }}
{{- if and .Values.frontendRelease.enabled .Values.frontendRelease.dispatch.enabled .Values.frontendRelease.dispatch.triggers.enabled }}
{{- if .Values.frontendPr.enabled }}
{{- fail "Disable legacy frontendPr.enabled before enabling frontend dispatcher triggers" }}
{{- end }}
---
{{ include "application.dispatchTriggers" (dict "root" . "scope" "frontend" "settings" .Values.frontendRelease) }}
{{- end }}
