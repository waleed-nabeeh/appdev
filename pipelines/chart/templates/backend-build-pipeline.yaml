{{- define "application.buildFanout" }}
{{- $root := .root }}
{{- $scope := .scope }}
{{- $settings := .settings }}
{{- $frontend := eq $scope "frontend" }}
{{- $catalog := $root.Files.Get (printf "files/%s-services.json" $scope) | fromJsonArray }}
{{- $selected := $settings.selectedServices }}
{{- $gitops := and $settings.dispatch.enabled $settings.dispatch.gitops.enabled }}
{{- $known := list }}
{{- $services := list }}
{{- range $service := $catalog }}
{{- $known = append $known $service.name }}
{{- if or (empty $selected) (has $service.name $selected) }}
{{- $services = append $services $service }}
{{- end }}
{{- end }}
{{- if ne (len $selected) (len (uniq $selected)) }}
{{- fail (printf "%s selectedServices must not contain duplicates" $scope) }}
{{- end }}
{{- range $name := $selected }}
{{- if not (has $name $known) }}
{{- fail (printf "Unknown %s service: %s" $scope $name) }}
{{- end }}
{{- end }}
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: {{ $scope }}-build-resolve
  namespace: {{ $root.Release.Namespace }}
spec:
  params:
    - name: revision
      type: string
    - name: commit
      type: string
      default: ""
    - name: services
      type: string
      default: ""
  workspaces:
    - name: git-credentials
  results:
    - name: commit
    - name: tag
  volumes:
    - name: work
      emptyDir: {}
  steps:
    - name: resolve
      image: {{ $root.Values.images.git | quote }}
      volumeMounts:
        - {name: work, mountPath: /work}
      env:
        - name: HOME
          value: /work/home
        - name: SOURCE_URL
          value: {{ $settings.sourceUrl | quote }}
        - name: REVISION
          value: $(params.revision)
        - name: COMMIT
          value: $(params.commit)
        - name: SERVICES
          value: $(params.services)
      script: |
        #!/bin/sh
        set -eu
        mkdir -p "$HOME"
        cp -R "$(workspaces.git-credentials.path)"/. "$HOME"/
        chmod -R go-rwx "$HOME"
        git config --global credential.helper store
        if [ -n "$SERVICES" ]; then printf 'Selected services: %s\n' "$SERVICES"; fi
        REVISION="${REVISION#refs/heads/}"
        case "$REVISION" in ''|*[!a-zA-Z0-9_./-]*) echo 'Invalid source branch' >&2; exit 1 ;; esac
        git check-ref-format "refs/heads/$REVISION"
        if [ -z "$COMMIT" ]; then
          COMMIT=$(git ls-remote --exit-code "$SOURCE_URL" "refs/heads/$REVISION" | cut -f1)
        fi
        if [ "${#COMMIT}" -ne 40 ] || ! printf '%s' "$COMMIT" | grep -Eq '^[0-9a-f]{40}$'; then
          echo 'Expected a full 40-character source commit' >&2; exit 1;
        fi
        printf '%s' "$COMMIT" > "$(results.commit.path)"
        printf '%.8s' "$COMMIT" > "$(results.tag.path)"
---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: application-{{ $scope }}-build-fanout
  namespace: {{ $root.Release.Namespace }}
  labels:
    app.kubernetes.io/component: {{ $scope }}
spec:
  params:
    - name: source-revision
      type: string
      default: {{ $settings.sourceRevision | quote }}
    - name: source-commit
      type: string
      default: ""
  results:
    - name: source-commit
      value: $(tasks.resolve-source.results.commit)
    - name: image-tag
      value: $(tasks.resolve-source.results.tag)
{{- range $service := $services }}
    - name: {{ $service.name }}-image
      value: $(tasks.build-{{ $service.name }}.results.image-url)
    - name: {{ $service.name }}-digest
      value: $(tasks.build-{{ $service.name }}.results.image-digest)
{{- end }}
  workspaces:
    - name: git-credentials
    - name: registry-auth
{{- if $frontend }}
    - name: npm-auth
{{- end }}
{{- range $service := $services }}
    - name: source-{{ $service.name }}
{{- end }}
  tasks:
    - name: resolve-source
      taskRef:
        name: {{ $scope }}-build-resolve
      params:
        - name: revision
          value: $(params.source-revision)
        - name: commit
          value: $(params.source-commit)
      workspaces:
        - name: git-credentials
          workspace: git-credentials
{{- range $service := $services }}
    - name: clone-{{ $service.name }}
      runAfter: [resolve-source]
      taskRef:
        name: clone
      params:
        - name: url
          value: {{ $settings.sourceUrl | quote }}
        - name: revision
          value: $(params.source-revision)
        - name: commit
          value: $(tasks.resolve-source.results.commit)
      workspaces:
        - name: source
          workspace: source-{{ $service.name }}
        - name: git-credentials
          workspace: git-credentials
    - name: test-{{ $service.name }}
      runAfter: [clone-{{ $service.name }}]
{{- if $settings.allowTestFailure }}
      onError: continue
{{- end }}
      taskRef:
        name: {{ ternary "frontend-unit-test" "unit-test" $frontend }}
      params:
        - name: project
          value: {{ $service.project | quote }}
      workspaces:
        - name: source
          workspace: source-{{ $service.name }}
{{- if $frontend }}
        - name: npm-auth
          workspace: npm-auth
{{- end }}
    - name: build-{{ $service.name }}
      runAfter: [test-{{ $service.name }}]
      taskRef:
        name: build-image
      params:
        - name: image
          value: {{ $settings.imageRepository }}/{{ $service.name }}:$(tasks.resolve-source.results.tag)
        - name: context
          value: {{ $service.context | quote }}
        - name: containerfile
          value: {{ $service.containerfile | quote }}
        - name: build-args
          value: {{ $settings.buildArgs | toJson }}
      workspaces:
        - name: source
          workspace: source-{{ $service.name }}
        - name: registry-auth
          workspace: registry-auth
{{- if $frontend }}
        - name: npm-auth
          workspace: npm-auth
{{- end }}
    - name: scan-{{ $service.name }}
      runAfter: [build-{{ $service.name }}]
      taskRef:
        name: scan-image
      params:
        - name: image
          value: $(tasks.build-{{ $service.name }}.results.image-url)
    - name: gate-{{ $service.name }}
      runAfter: [scan-{{ $service.name }}]
      taskRef:
        name: security-gate
      params:
        - name: image
          value: $(tasks.build-{{ $service.name }}.results.image-url)
    - name: sign-{{ $service.name }}
      runAfter: [gate-{{ $service.name }}]
      taskRef:
        name: sign-image
      params:
        - name: image
          value: $(tasks.build-{{ $service.name }}.results.image-url)
      workspaces:
        - name: registry-auth
          workspace: registry-auth
{{- end }}
{{- if $gitops }}
{{- $names := list }}
{{- $images := dict }}
{{- range $service := $services }}
{{- $names = append $names $service.name }}
{{- $repository := printf "%s/%s" $settings.imageRepository $service.name }}
{{- $_ := set $images $service.name (dict "repository" $repository "tag" "$(tasks.resolve-source.results.tag)" "digest" (printf "$(tasks.build-%s.results.image-digest)" $service.name) "image" (printf "%s@$(tasks.build-%s.results.image-digest)" $repository $service.name)) }}
{{- end }}
    - name: update-gitops
      runAfter:
{{- range $service := $services }}
        - sign-{{ $service.name }}
{{- end }}
      taskRef:
        name: {{ $scope }}-gitops-update
      params:
        - name: source-commit
          value: $(tasks.resolve-source.results.commit)
        - name: release-json
          value: {{ dict "schemaVersion" 1 "succeeded" true "sourceCommit" "$(tasks.resolve-source.results.commit)" "selected" $names "images" $images "failed" (list) "notStarted" (list) | toJson | quote }}
      workspaces:
        - name: git-credentials
          workspace: git-credentials
{{- end }}
---
# Store only a run template in Helm. Applying the release never starts builds.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $scope }}-build-run-template
  namespace: {{ $root.Release.Namespace }}
data:
{{- $modes := list false }}
{{- if $gitops }}
{{- $modes = append $modes true }}
{{- end }}
{{- range $update := $modes }}
  {{ ternary "gitops-pipelinerun.yaml" "pipelinerun.yaml" $update }}: |
    apiVersion: tekton.dev/v1
    kind: PipelineRun
    metadata:
      generateName: {{ ternary (printf "%s-gitops-test-" $scope) (printf "%s-build-" $scope) $update }}
      namespace: {{ $root.Release.Namespace }}
      labels:
        app.kubernetes.io/component: {{ $scope }}
        app.kubernetes.io/part-of: customer-build-fanout
    spec:
      pipelineRef:
        name: application-{{ $scope }}-build-fanout
      taskRunTemplate:
        serviceAccountName: {{ $root.Values.serviceAccount.name }}
      timeouts:
        pipeline: 4h0m0s
        tasks: 3h50m0s
      params:
        - name: source-revision
          value: {{ $settings.sourceRevision | quote }}
        - name: source-commit
          value: ""
      workspaces:
        - name: git-credentials
          secret:
            secretName: git-credentials
        - name: registry-auth
          secret:
            secretName: registry-auth
{{- if $frontend }}
        - name: npm-auth
          secret:
            secretName: npm-auth
{{- end }}
{{- range $service := $services }}
        - name: source-{{ $service.name }}
          volumeClaimTemplate:
            metadata:
              labels:
                pipeline: {{ $scope }}-build-fanout
                service: {{ $service.name }}
            spec:
              accessModes: [ReadWriteOnce]
              resources:
                requests:
                  storage: {{ $settings.workspaceSize | quote }}
{{- end }}
{{- end }}
{{- end }}

{{- if .Values.backendBuild.enabled }}
{{ include "application.buildFanout" (dict "root" . "scope" "backend" "settings" .Values.backendBuild) }}
{{- end }}
{{- if and .Values.applicationBuild.singleRun .Values.frontendRelease.enabled }}
---
{{ include "application.buildFanout" (dict "root" . "scope" "frontend" "settings" .Values.frontendRelease) }}
{{- end }}
