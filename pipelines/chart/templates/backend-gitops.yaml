{{- if or (and .Values.backendBuild.enabled .Values.backendBuild.dispatch.enabled .Values.backendBuild.dispatch.gitops.enabled) (and .Values.frontendRelease.enabled (eq (default "json" .Values.frontendRelease.gitops.format) "yaml")) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: gitops-yaml-code
  namespace: {{ .Release.Namespace }}
binaryData:
  js-yaml.js: {{ .Files.Get "files/vendor/js-yaml.js" | b64enc | quote }}
data:
  backend-dispatch.js: |
{{ .Files.Get "files/backend-dispatch.js" | indent 4 }}
  backend-gitops-update.js: |
{{ .Files.Get "files/backend-gitops-update.js" | indent 4 }}
{{- end }}
{{- if and .Values.backendBuild.enabled .Values.backendBuild.dispatch.enabled .Values.backendBuild.dispatch.gitops.enabled }}
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: backend-gitops-base
  namespace: {{ .Release.Namespace }}
spec:
  workspaces:
    - name: git-credentials
  results:
    - name: commit
  volumes:
    - name: work
      emptyDir: {}
  steps:
    - name: resolve
      image: {{ .Values.images.git | quote }}
      volumeMounts:
        - {name: work, mountPath: /work}
      env:
        - {name: HOME, value: /work/home}
        - {name: GITOPS_URL, value: {{ .Values.backendBuild.dispatch.gitops.repository | quote }}}
        - {name: GITOPS_BRANCH, value: {{ .Values.backendBuild.dispatch.gitops.revision | quote }}}
      script: |
        #!/bin/sh
        set -eu
        mkdir -p "$HOME"
        cp -R "$(workspaces.git-credentials.path)"/. "$HOME"/
        chmod -R go-rwx "$HOME"
        git config --global credential.helper store
        git check-ref-format "refs/heads/$GITOPS_BRANCH"
        base=$(git ls-remote --exit-code "$GITOPS_URL" "refs/heads/$GITOPS_BRANCH" | cut -f1)
        [ "${#base}" -eq 40 ]
        printf '%s' "$base" | grep -Eq '^[0-9a-f]{40}$'
        printf '%s' "$base" > "$(results.commit.path)"
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: backend-gitops-update
  namespace: {{ .Release.Namespace }}
spec:
  params:
    - {name: release-record, type: string, default: ""}
    - {name: release-json, type: string, default: ""}
    - {name: source-commit, type: string}
    - {name: expected-base, type: string}
  results:
    - name: commit
  workspaces:
    - name: git-credentials
  volumes:
    - name: work
      emptyDir: {}
    - name: config
      projected:
        sources:
          - configMap: {name: backend-dispatch-config}
          - configMap: {name: gitops-yaml-code}
  stepTemplate:
    volumeMounts:
      - {name: work, mountPath: /work}
      - {name: config, mountPath: /config, readOnly: true}
    env:
      - {name: HOME, value: /work/home}
      - {name: GITOPS_URL, value: {{ .Values.backendBuild.dispatch.gitops.repository | quote }}}
      - {name: GITOPS_BRANCH, value: {{ .Values.backendBuild.dispatch.gitops.revision | quote }}}
      - {name: VALUES_FILE, value: {{ .Values.backendBuild.dispatch.gitops.valuesFile | quote }}}
      - {name: EXPECTED_BASE, value: $(params.expected-base)}
  steps:
    - name: clone
      image: {{ .Values.images.git | quote }}
      script: |
        #!/bin/sh
        set -eu
        mkdir -p "$HOME"
        cp -R "$(workspaces.git-credentials.path)"/. "$HOME"/
        chmod -R go-rwx "$HOME"
        git config --global credential.helper store
        git clone --single-branch --branch "$GITOPS_BRANCH" "$GITOPS_URL" /work/repo
        # Git and Node images can run with different UIDs in the same Pod.
        # Share the checkout with their group; keep credential HOME private.
        chmod -R g+rwX /work/repo
        if ! git -C /work/repo merge-base --is-ancestor "$EXPECTED_BASE" HEAD || ! git -C /work/repo diff --quiet "$EXPECTED_BASE" HEAD -- "$VALUES_FILE"; then
          echo 'Backend GitOps file changed since this batch began. No update pushed; review and rerun.' >&2
          exit 1
        fi
    - name: update-yaml
      image: {{ .Values.images.nodejs24 | quote }}
      env:
        - {name: RELEASE_RECORD, value: $(params.release-record)}
        - {name: RELEASE_JSON, value: $(params.release-json)}
        - {name: SOURCE_COMMIT, value: $(params.source-commit)}
        - {name: NAMESPACE, value: {{ .Release.Namespace | quote }}}
      script: |
        #!/usr/bin/env node
{{ .Files.Get "files/backend-gitops-update.js" | indent 8 }}
    - name: push
      image: {{ .Values.images.git | quote }}
      script: |
{{ .Files.Get "files/gitops-push.sh" | indent 8 }}
        git rev-parse HEAD | tr -d '\n' > "$(results.commit.path)"
{{- end }}
