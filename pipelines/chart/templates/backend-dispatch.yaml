{{- define "application.buildDispatcher" }}
{{- $root := .root }}
{{- $scope := .scope }}
{{- $settings := .settings }}
{{- $frontend := eq $scope "frontend" }}
{{- if and $root.Values.applicationBuild.singleRun (not $settings.dispatch.gitops.enabled) }}
{{- fail (printf "%s single-run fanout requires its GitOps stage enabled" $scope) }}
{{- end }}
{{- $catalog := $root.Files.Get (printf "files/%s-services.json" $scope) | fromJsonArray }}
{{- $enabled := list }}
{{- range $service := $catalog }}
{{- if or (empty $settings.selectedServices) (has $service.name $settings.selectedServices) }}
{{- $enabled = append $enabled $service }}
{{- end }}
{{- end }}
{{- $known := list }}
{{- range $service := $catalog }}
{{- $known = append $known $service.name }}
{{- end }}
{{- if ne (len $settings.selectedServices) (len (uniq $settings.selectedServices)) }}
{{- fail (printf "%s selectedServices contains duplicates" $scope) }}
{{- end }}
{{- range $name := $settings.selectedServices }}
{{- if not (has $name $known) }}
{{- fail (printf "Unknown %s service: %s" $scope $name) }}
{{- end }}
{{- end }}
{{- if lt (int $settings.dispatch.maxParallel) 1 }}
{{- fail "dispatch.maxParallel must be positive" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $scope }}-dispatch-config
  namespace: {{ $root.Release.Namespace }}
data:
{{- if $root.Values.applicationBuild.singleRun }}
  backend-dispatch.js: |
{{ $root.Files.Get "files/backend-dispatch.js" | indent 4 }}
{{- end }}
  config.json: |
    {{ dict "scope" $scope "fanoutPipeline" (printf "application-%s-build-fanout" $scope) "childPipeline" (printf "application-%s-service-build" $scope) "npmAuth" $frontend "catalog" $enabled "imageRepository" $settings.imageRepository "buildServiceAccount" $root.Values.serviceAccount.name "workspaceSize" $settings.workspaceSize "maxParallel" (int $settings.dispatch.maxParallel) "timeoutSeconds" (int $settings.dispatch.timeoutSeconds) "childTimeout" $settings.dispatch.childTimeout | toJson }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $scope }}-dispatcher
  namespace: {{ $root.Release.Namespace }}
imagePullSecrets:
{{ $settings.dispatch.imagePullSecrets | toYaml | indent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $scope }}-dispatcher
  namespace: {{ $root.Release.Namespace }}
rules:
  - apiGroups: [tekton.dev]
    resources: [pipelineruns]
    verbs: [get, create, patch]
{{- if $root.Values.applicationBuild.singleRun }}
  - apiGroups: [tekton.dev]
    resources: [pipelines]
    resourceNames: [application-{{ $scope }}-build-fanout]
    verbs: [get]
{{- else }}
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, create]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $scope }}-dispatcher
  namespace: {{ $root.Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ $scope }}-dispatcher
    namespace: {{ $root.Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $scope }}-dispatcher
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: {{ ternary (printf "%s-build-dispatch" $scope) (printf "%s-dispatch-select" $scope) $root.Values.applicationBuild.singleRun }}
  namespace: {{ $root.Release.Namespace }}
spec:
  params:
    - {name: services, type: string, default: all, description: "Comma-separated allowed service names or all"}
    - {name: selection-mode, type: string, default: manual}
    - {name: source-revision, type: string, default: {{ $settings.sourceRevision | quote }}}
    - {name: source-commit, type: string, default: ""}
    - {name: target-commit, type: string, default: ""}
  workspaces:
    - name: git-credentials
  results:
    - name: services
    - name: commit
{{- if $root.Values.applicationBuild.singleRun }}
    - name: pipeline-run
{{- end }}
  volumes:
    - name: work
      emptyDir: {}
    - name: config
      configMap:
        name: {{ $scope }}-dispatch-config
  stepTemplate:
    volumeMounts:
      - {name: work, mountPath: /work}
      - {name: config, mountPath: /config, readOnly: true}
    env:
      - {name: MODE, value: $(params.selection-mode)}
  steps:
    - name: source
      image: {{ $root.Values.images.git | quote }}
      env:
        - {name: HOME, value: /work/home}
        - {name: CREDENTIALS_PATH, value: $(workspaces.git-credentials.path)}
        - {name: REVISION, value: $(params.source-revision)}
        - {name: COMMIT, value: $(params.source-commit)}
        - {name: TARGET_COMMIT, value: $(params.target-commit)}
        - {name: SOURCE_URL, value: {{ $settings.sourceUrl | quote }}}
      script: |
{{ $root.Files.Get "files/backend-select-source.sh" | indent 8 }}
    - name: {{ ternary "create-fanout" "select" $root.Values.applicationBuild.singleRun }}
      image: {{ $root.Values.images.nodejs24 | quote }}
      env:
        - {name: ACTION, value: select}
        - {name: SERVICES, value: $(params.services)}
{{- if $root.Values.applicationBuild.singleRun }}
        - {name: REVISION, value: $(params.source-revision)}
        - {name: DISPATCHER_NAME, value: $(context.taskRun.name)}
        - {name: DISPATCHER_UID, value: $(context.taskRun.uid)}
        - {name: NAMESPACE, value: {{ $root.Release.Namespace | quote }}}
{{- end }}
      script: |
        #!/usr/bin/env node
{{ $root.Files.Get (ternary "files/build-fanout-dispatch.js" "files/backend-dispatch.js" $root.Values.applicationBuild.singleRun) | indent 8 }}
{{- if not $root.Values.applicationBuild.singleRun }}
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: {{ $scope }}-service-settings
  namespace: {{ $root.Release.Namespace }}
spec:
  params:
    - {name: service, type: string}
    - {name: source-commit, type: string}
    - {name: source-revision, type: string}
  results:
    - name: project
    - name: containerfile
    - name: context
    - name: image
    - name: commit
  volumes:
    - name: config
      configMap:
        name: {{ $scope }}-dispatch-config
  steps:
    - name: prepare
      image: {{ $root.Values.images.nodejs24 | quote }}
      volumeMounts:
        - {name: config, mountPath: /config, readOnly: true}
      env:
        - {name: ACTION, value: prepare}
        - {name: SERVICE, value: $(params.service)}
        - {name: COMMIT, value: $(params.source-commit)}
        - {name: REVISION, value: $(params.source-revision)}
      script: |
        #!/usr/bin/env node
{{ $root.Files.Get "files/backend-dispatch.js" | indent 8 }}
---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: application-{{ $scope }}-service-build
  namespace: {{ $root.Release.Namespace }}
spec:
  params:
    - {name: service, type: string}
    - {name: source-commit, type: string}
    - {name: source-revision, type: string}
  results:
    - {name: source-commit, value: $(tasks.settings.results.commit)}
    - {name: image-url, value: $(tasks.build.results.image-url)}
    - {name: image-digest, value: $(tasks.build.results.image-digest)}
  workspaces:
    - name: source
    - name: git-credentials
    - name: registry-auth
{{- if $frontend }}
    - name: npm-auth
{{- end }}
  tasks:
    - name: settings
      taskRef: {name: {{ $scope }}-service-settings}
      params:
        - {name: service, value: $(params.service)}
        - {name: source-commit, value: $(params.source-commit)}
        - {name: source-revision, value: $(params.source-revision)}
    - name: clone
      runAfter: [settings]
      taskRef: {name: clone}
      params:
        - {name: url, value: {{ $settings.sourceUrl | quote }}}
        - {name: revision, value: $(params.source-revision)}
        - {name: commit, value: $(params.source-commit)}
      workspaces:
        - {name: source, workspace: source}
        - {name: git-credentials, workspace: git-credentials}
    - name: test
      runAfter: [clone]
{{- if $settings.allowTestFailure }}
      onError: continue
{{- end }}
      taskRef: {name: {{ ternary "frontend-unit-test" "unit-test" $frontend }}}
      params:
        - {name: project, value: $(tasks.settings.results.project)}
      workspaces:
        - {name: source, workspace: source}
{{- if $frontend }}
        - {name: npm-auth, workspace: npm-auth}
{{- end }}
    - name: build
      runAfter: [test]
      taskRef: {name: build-image}
      params:
        - {name: image, value: $(tasks.settings.results.image)}
        - {name: context, value: $(tasks.settings.results.context)}
        - {name: containerfile, value: $(tasks.settings.results.containerfile)}
        - name: build-args
          value: {{ $settings.buildArgs | toJson }}
      workspaces:
        - {name: source, workspace: source}
        - {name: registry-auth, workspace: registry-auth}
{{- if $frontend }}
        - {name: npm-auth, workspace: npm-auth}
{{- end }}
    - name: scan
      runAfter: [build]
      taskRef: {name: scan-image}
      params:
        - {name: image, value: $(tasks.build.results.image-url)}
    - name: gate
      runAfter: [scan]
      taskRef: {name: security-gate}
      params:
        - {name: image, value: $(tasks.build.results.image-url)}
    - name: sign
      runAfter: [gate]
      taskRef: {name: sign-image}
      params:
        - {name: image, value: $(tasks.build.results.image-url)}
      workspaces:
        - {name: registry-auth, workspace: registry-auth}
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: {{ $scope }}-dispatch-run
  namespace: {{ $root.Release.Namespace }}
spec:
  params:
    - {name: selected, type: string}
    - {name: source-commit, type: string}
    - {name: source-revision, type: string}
    - {name: parent, type: string}
  results:
    - name: release-record
  volumes:
    - name: config
      configMap:
        name: {{ $scope }}-dispatch-config
  steps:
    - name: dispatch
      image: {{ $root.Values.images.nodejs24 | quote }}
      volumeMounts:
        - {name: config, mountPath: /config, readOnly: true}
      env:
        - {name: ACTION, value: dispatch}
        - {name: SELECTED, value: $(params.selected)}
        - {name: COMMIT, value: $(params.source-commit)}
        - {name: REVISION, value: $(params.source-revision)}
        - {name: PARENT, value: $(params.parent)}
        - {name: NAMESPACE, value: {{ $root.Release.Namespace | quote }}}
      script: |
        #!/usr/bin/env node
{{ $root.Files.Get "files/backend-dispatch.js" | indent 8 }}
---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: application-{{ $scope }}-dispatch
  namespace: {{ $root.Release.Namespace }}
spec:
  params:
    - {name: services, type: string, default: all, description: "Comma-separated allowed service names, or all"}
    - {name: selection-mode, type: string, default: manual, description: "manual uses services; diff uses source-commit and target-commit"}
    - {name: source-revision, type: string, default: {{ $settings.sourceRevision | quote }}}
    - {name: source-commit, type: string, default: "", description: "Optional full source SHA; empty resolves source-revision HEAD"}
    - {name: target-commit, type: string, default: "", description: "Full target SHA required only for diff/PR selection"}
  results:
    - {name: source-commit, value: $(tasks.select.results.commit)}
    - {name: selected-services, value: $(tasks.select.results.services)}
    - {name: release-record, value: $(tasks.dispatch.results.release-record)}
  workspaces:
    - name: git-credentials
  tasks:
    - name: select
      timeout: 10m0s
      taskRef: {name: {{ $scope }}-dispatch-select}
      params:
        - {name: services, value: $(params.services)}
        - {name: selection-mode, value: $(params.selection-mode)}
        - {name: source-revision, value: $(params.source-revision)}
        - {name: source-commit, value: $(params.source-commit)}
        - {name: target-commit, value: $(params.target-commit)}
      workspaces:
        - {name: git-credentials, workspace: git-credentials}
    - name: dispatch
      timeout: 11h5m0s
      runAfter: [select]
      taskRef: {name: {{ $scope }}-dispatch-run}
      params:
        - {name: selected, value: $(tasks.select.results.services)}
        - {name: source-commit, value: $(tasks.select.results.commit)}
        - {name: source-revision, value: $(params.source-revision)}
        - {name: parent, value: $(context.pipelineRun.name)}
{{- if $settings.dispatch.gitops.enabled }}
    - name: update-gitops
      runAfter: [dispatch]
      taskRef: {name: {{ $scope }}-gitops-update}
      params:
        - {name: release-record, value: $(tasks.dispatch.results.release-record)}
        - {name: source-commit, value: $(tasks.select.results.commit)}
      workspaces:
        - {name: git-credentials, workspace: git-credentials}
{{- end }}
{{- end }}
{{- end }}

{{- if and .Values.backendBuild.enabled .Values.backendBuild.dispatch.enabled }}
{{ include "application.buildDispatcher" (dict "root" . "scope" "backend" "settings" .Values.backendBuild) }}
{{- end }}
{{- if and .Values.frontendRelease.enabled .Values.frontendRelease.dispatch.enabled }}
---
{{ include "application.buildDispatcher" (dict "root" . "scope" "frontend" "settings" .Values.frontendRelease) }}
{{- end }}
