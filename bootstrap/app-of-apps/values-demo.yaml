default:
  app:
    enabled: true
    project: customer-platform
    destination:
      server: https://kubernetes.default.svc
    source:
      repoURL: https://github.com/waleed-nabeeh/appdev.git
      targetRevision: develop
    enableAutoSync: true
    autoSyncPrune: true
    syncOptions:
      - CreateNamespace=true
  project:
    labels:
      app.kubernetes.io/part-of: customer-release-engineering

projects:
  customer-platform:
    description: Customer shared release-engineering platform services
    sourceRepos:
      - https://github.com/waleed-nabeeh/appdev.git
    extraFields: |
      clusterResourceWhitelist:
        - group: rbac.authorization.k8s.io
          kind: ClusterRoleBinding
    destinations: |
      - namespace: vault
        server: https://kubernetes.default.svc
      - namespace: trusted-artifact-signer
        server: https://kubernetes.default.svc

applications:
  vault:
    destination:
      namespace: vault
      server: https://kubernetes.default.svc
    source:
      repoURL: https://github.com/waleed-nabeeh/appdev.git
      targetRevision: develop
      path: platform/vault/chart
      extraSourceFields: |
        helm:
          valueFiles:
            - values-demo.yaml
  rhtas:
    enabled: false
    destination:
      namespace: trusted-artifact-signer
      server: https://kubernetes.default.svc
    source:
      repoURL: https://github.com/waleed-nabeeh/appdev.git
      targetRevision: develop
      path: platform/rhtas/chart
