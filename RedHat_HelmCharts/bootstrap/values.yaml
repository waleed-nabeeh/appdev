repository: https://github.com/waleed-nabeeh/appdev.git
revision: develop
project: customer-platform
destinationServer: https://kubernetes.default.svc
applications:
  vault:
    namespace: infra-platforms
    path: charts/vault
    releaseName: vault
    valueFiles:
      - values-customer.yaml
  rhtas:
    namespace: infra-platforms
    path: charts/rhtas
    releaseName: rhtas
    valueFiles:
      - values.yaml
