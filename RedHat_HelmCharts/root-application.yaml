apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: customer-platform-root
  namespace: openshift-gitops
spec:
  # The administrator must approve this project's access to create the children.
  project: default
  source:
    repoURL: REPLACE_INTERNAL_GIT_URL
    targetRevision: REPLACE_BRANCH
    path: bootstrap
    helm:
      releaseName: customer-platform
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
